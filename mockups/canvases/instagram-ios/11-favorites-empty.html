<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram - Favorites, empty</title>
<style>
:root{
  /* Font */
  --ig-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --ig-bg:#FFFFFF;
  --ig-fill:#F1F2F6;
  --ig-bar-dark:#0D1116;
  --ig-toast:#6C666D;
  --ig-badge:#212329;
  --ig-scrim:#383C41;
  --ig-pop:radial-gradient(20% 25% at 10% 12.5%,#F1C1B6 0%,#F1C1B600 100%),radial-gradient(20% 25% at 30% 12.5%,#F0BCB6 0%,#F0BCB600 100%),radial-gradient(20% 25% at 50% 12.5%,#F8EEFF 0%,#F8EEFF00 100%),radial-gradient(20% 25% at 70% 12.5%,#F9DBEA 0%,#F9DBEA00 100%),radial-gradient(20% 25% at 90% 12.5%,#F4AEFC 0%,#F4AEFC00 100%),radial-gradient(20% 25% at 10% 37.5%,#ECC9D1 0%,#ECC9D100 100%),radial-gradient(20% 25% at 30% 37.5%,#EAC5C8 0%,#EAC5C800 100%),radial-gradient(20% 25% at 50% 37.5%,#F5D7E2 0%,#F5D7E200 100%),radial-gradient(20% 25% at 70% 37.5%,#F7C5C5 0%,#F7C5C500 100%),radial-gradient(20% 25% at 90% 37.5%,#F7C3DF 0%,#F7C3DF00 100%),radial-gradient(20% 25% at 10% 62.5%,#F0C7B5 0%,#F0C7B500 100%),radial-gradient(20% 25% at 30% 62.5%,#F0C3B3 0%,#F0C3B300 100%),radial-gradient(20% 25% at 50% 62.5%,#F6E9F7 0%,#F6E9F700 100%),radial-gradient(20% 25% at 70% 62.5%,#F9F0C7 0%,#F9F0C700 100%),radial-gradient(20% 25% at 90% 62.5%,#FCDCA6 0%,#FCDCA600 100%),radial-gradient(20% 25% at 10% 87.5%,#EFF3EC 0%,#EFF3EC00 100%),radial-gradient(20% 25% at 30% 87.5%,#ECF3F6 0%,#ECF3F600 100%),radial-gradient(20% 25% at 50% 87.5%,#EEF4FA 0%,#EEF4FA00 100%),radial-gradient(20% 25% at 70% 87.5%,#E9F0FC 0%,#E9F0FC00 100%),radial-gradient(20% 25% at 90% 87.5%,#F1F6ED 0%,#F1F6ED00 100%),#F5D7BE;

  /* Line */
  --ig-hairline:#DADADA;
  --ig-ring:#DDDEE2;
  --ig-nav-line:#EFEFEF;
  --ig-track:#2E3137;
  --ig-played:#A4AAB1;

  /* Ink */
  --ig-ink:#0E0F13;
  --ig-ink-2:#6E7074;
  --ig-ink-inv:#FFFFFF;

  /* Accent */
  --ig-accent:#4A5DF6;
  --ig-accent-2:#465DFF;
  --ig-notif:#EB3437;
  --ig-link:#3846C7;
  --ig-verified:#3F96F4;
  --ig-sub:#7339F5;
  --ig-story:conic-gradient(#E731A3 0deg,#D52BBD 30deg,#D32CCB 60deg,#E433A1 90deg,#EB335A 120deg,#E95F20 150deg,#EEA837 180deg,#F7CE43 210deg,#F4D243 240deg,#F0A63B 270deg,#EE6329 300deg,#EB3260 330deg,#E731A3 360deg);

  /* Radius */
  --ig-r-btn:8px;
  --ig-r-cta:12px;
  --ig-r-toast:16px;
  --ig-r-pop:20px;
  --ig-r-phone:52px;

  /* Type */
  --ig-t-nav:700 20px/24px var(--ig-font);
  --ig-t-stat:600 16px/20px var(--ig-font);
  --ig-t-body:400 14px/18px var(--ig-font);
  --ig-t-bodys:600 14px/18px var(--ig-font);
  --ig-t-menu:400 16px/20px var(--ig-font);
  --ig-t-h2:700 22px/26px var(--ig-font);
  --ig-t-cap:400 12px/15px var(--ig-font);
  --ig-t-caps:600 12px/15px var(--ig-font);
  --ig-t-title:700 24px/29px var(--ig-font);
  --ig-t-note:400 15px/18px var(--ig-font);
  --ig-t-time:590 17px/22px var(--ig-font);

  /* Metrics */
  --ig-w:393px;
  --ig-h:852px;
  --ig-status:54px;
  --ig-gutter:16px;
  --ig-col:123px;
  --ig-avatar:86px;
  --ig-btn:32px;
  --ig-hl:64px;
  --ig-tile:130.33px;
  --ig-pitch:131.33px;
  --ig-row:174.67px;
  --ig-reel:232.67px;
  --ig-rail:104.67px;
  --ig-tab:78px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ig-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--ig-w);height:var(--ig-h);
  border-radius:var(--ig-r-phone);overflow:hidden;background:var(--ig-bg);color:var(--ig-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--ig-w);height:var(--ig-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--ig-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.t{position:absolute;white-space:nowrap}
.t b{font-weight:600}
.c{transform:translateX(-50%)}
.a{position:absolute;display:block}
.ph{object-fit:cover}
.rnd{border-radius:50%}
svg{position:absolute;display:block}
/* A gradient disc masked to an annulus, so what shows in the hole is whatever
   is behind it: the page ground on a profile, the video on a feed post. */
.ring{position:absolute;border-radius:50%;background:var(--ig-story)}
.hair{border:.33px solid var(--ig-ring)}
.arc{clip-path:circle(39.8px at 39.8px 39.8px)}
.btn{position:absolute;height:var(--ig-btn);border-radius:var(--ig-r-btn);background:var(--ig-fill)}
.btn.acc{background:var(--ig-accent)}
.hl{position:absolute;width:var(--ig-hl);height:var(--ig-hl);border-radius:50%;
  border:3.33px solid var(--ig-ring)}
.st{position:absolute;left:var(--ig-col);display:flex;gap:36px}
.st b{display:block;font:var(--ig-t-stat)}
.st i{display:block;font:var(--ig-t-body);font-style:normal;margin-top:-.93px}
/* one layer, so c06 can take the whole tab bar to half opacity in one place */
.tb{position:absolute;inset:0;color:var(--ig-ink-2)}
.tb .und{position:absolute;height:2px;background:var(--ig-ink)}
.div{position:absolute;left:0;width:var(--ig-w);height:.33px;background:var(--ig-hairline);inset:auto}
.t i{font-style:normal;color:var(--ig-ink-2)}
.bar{position:absolute;left:0;bottom:0;width:var(--ig-w)}
.pill{position:absolute;width:70px;height:32px;border-radius:var(--ig-r-btn);
  border:1px solid rgba(255,255,255,.5)}
.cta{position:absolute;height:44px;border-radius:var(--ig-r-cta);background:var(--ig-accent-2)}
.pop{position:absolute;border-radius:var(--ig-r-pop);background:var(--ig-pop);
  box-shadow:0 2px 10px rgba(0,0,0,.16)}
.toast{position:absolute;border-radius:var(--ig-r-toast);background:var(--ig-toast)}
.prog{position:absolute;left:0;top:767px;width:var(--ig-w);height:1.67px;background:var(--ig-track)}
.prog i{position:absolute;left:0;top:0;height:1.67px;background:var(--ig-played)}</style>
</head>

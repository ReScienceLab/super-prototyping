<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Duolingo - League promotion</title>
<style>
:root{
  /* Font */
  --d-font:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;

  /* Surface */
  --d-bg:#FFFFFF;
  --d-panel:#F7F7F7;
  --d-scrim:rgba(0,0,0,.396);
  --d-chip:#E2F2FF;
  --d-chip-2:#E5E5E5;

  /* Line */
  --d-rule:#E3E3E3;
  --d-border:#E5E5E5;
  --d-border-2:#E7E7E7;
  --d-grab:#B1B1B1;

  /* Ink */
  --d-ink:#4B4B4B;
  --d-ink-2:#AFAFAF;
  --d-ink-3:#9D9D9D;
  --d-ink-inv:#FFFFFF;
  --d-ink-inv-2:rgba(255,255,255,.72);

  /* Unit */
  --d-u-green:#59CC01;
  --d-u-green-d:#45A302;
  --d-u-red:#FF4C4B;
  --d-u-red-d:#CC3B3C;
  --d-u-blue:#1DB1F8;
  --d-u-blue-d:#1590C9;
  --d-u-sky:#53ADF0;
  --d-u-sky-d:#428CBD;
  --d-u-purple:#C385F7;
  --d-u-purple-d:#9D6BC5;

  /* Accent */
  --d-blue:#1DB1F8;
  --d-btn:#14B2F5;
  --d-btn-d:#0F9AD7;
  --d-cta:#53ADF0;
  --d-cta-d:#4395D3;
  --d-orange:#F89402;
  --d-pink:#CE91B1;
  --d-magenta:#B84B8C;

  /* Radius */
  --d-r-card:13.5px;
  --d-r-btn:10px;
  --d-r-sheet:16px;
  --d-r-tile:24px;
  --d-r-pill:999px;
  --d-r-phone:52px;

  /* Type */
  --d-t-time:590 17.6px/22px var(--d-font);
  --d-t-count:700 15.6px/20px var(--d-font);
  --d-t-kicker:800 11.7px/16px var(--d-font);
  --d-t-unit:800 19.4px/24px var(--d-font);
  --d-t-title:800 22.9px/29px var(--d-font);
  --d-t-title-2:800 22.9px/32px var(--d-font);
  --d-t-body:500 19.3px/23.2px var(--d-font);
  --d-t-btn:800 15.0px/20px var(--d-font);
  --d-t-link:800 15.6px/20px var(--d-font);
  --d-t-label:600 19.8px/22px var(--d-font);
  --d-t-chip:800 13.5px/18px var(--d-font);

  /* Metrics */
  --d-w:393px;
  --d-h:852px;
  --d-status:54px;
  --d-gutter:15.6px;
  --d-card-x:24.1px;
  --d-card-w:344.8px;
  --d-card-y:111px;
  --d-tabs-y:756.6px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--d-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--d-w);height:var(--d-h);
  border-radius:var(--d-r-phone);overflow:hidden;background:var(--d-bg);color:var(--d-ink);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.phone>*{position:absolute}
img.a{display:block;z-index:2}
.sb{left:0;top:0;width:var(--d-w);height:var(--d-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.3px;text-align:center;
  font:var(--d-t-time)}
.card{left:var(--d-card-x);top:var(--d-card-y);width:var(--d-card-w);
  border-radius:var(--d-r-card);z-index:1}
.card>div{position:absolute}
.card .k{left:16.6px;top:14.9px;font:var(--d-t-kicker);color:var(--d-ink-inv-2);
  letter-spacing:1.76px}
.card .u{left:16.6px;top:36.2px;font:var(--d-t-unit);color:var(--d-ink-inv);
  letter-spacing:-.43px}
.card .sep{top:0;bottom:-4px;left:289.1px;width:2px}
.num{top:72.6px;font:var(--d-t-count);letter-spacing:-.74px}
.tabrule{left:0;top:var(--d-tabs-y);width:var(--d-w);height:2.2px;background:var(--d-rule)}
.fab{left:321.4px;top:685.4px;width:55.3px;height:55.3px;border-radius:50%;
  background:var(--d-border);z-index:1}
.fab i{position:absolute;left:2.2px;right:2.2px;top:2.2px;bottom:4.5px;
  border-radius:50%;background:var(--d-bg)}
.btn{left:var(--d-gutter);width:361.8px;border-radius:var(--d-r-btn);z-index:3}
.btn span{position:absolute;font:var(--d-t-btn);color:var(--d-ink-inv)}
.pill{top:527.9px;left:161.5px;width:70px;height:25.9px;
  border-radius:var(--d-r-pill);z-index:1}
.sec,.desc,.chip{z-index:3}
.sec{font:var(--d-t-title);letter-spacing:-.25px}
.desc{font:var(--d-t-body);letter-spacing:.55px}
.chip{font:var(--d-t-chip)}
.sheetbody{left:0;width:var(--d-w);background:var(--d-bg);
  border-radius:var(--d-r-sheet) var(--d-r-sheet) 0 0;z-index:1}
.grab{left:178.5px;height:4.5px;border-radius:var(--d-r-pill);
  background:var(--d-grab);z-index:3}
.tile{left:266.8px;top:380.2px;width:55.3px;height:54px;border-radius:var(--d-r-tile);
  background:var(--d-bg);border:2.2px solid var(--d-border-2);z-index:1}
.title,.link{z-index:3}
.title{font:var(--d-t-title);letter-spacing:-.25px}
.link{font:var(--d-t-link);color:var(--d-blue)}
b{color:var(--d-blue);font-weight:inherit}</style>
</head>

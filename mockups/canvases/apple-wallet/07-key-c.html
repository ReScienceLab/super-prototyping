<style>
:root{
  --aw-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --aw-bg:#FFFFFF;
  --aw-black:#000000;
  --aw-white:#FFFFFF;
  --aw-sep:rgba(60,60,67,.3608);
  --aw-blur:rgba(255,255,255,.698);
  --aw-promo:#C7BCA9;
  --aw-promo2:#B19F8E;

  /* Ink */
  --aw-ink:#000000;
  --aw-blue:#007BFE;

  /* Radius */
  --aw-r-phone:52px;
  --aw-r-card:11px;
  --aw-r-promo:14px;
  --aw-r-pill:100px;

  /* Type */
  --aw-t-b15:590 15px/20px var(--aw-font);
  --aw-t-r17:400 17px/22px var(--aw-font);
  --aw-t-b17:590 17px/22px var(--aw-font);
  --aw-t-b28:700 28px/34px var(--aw-font);
  --aw-t-b34:700 34px/41px var(--aw-font);

  /* Metrics */
  --aw-w:393px;
  --aw-h:852px;
  --aw-sb:54px;
  --aw-header:167px;
  --aw-btn:34px;
  --aw-margin:17px;
  --aw-pad:21px;
  --aw-card-w:359px;
  --aw-card-h:226px;
  --aw-card-pitch:49px;
  --aw-illo-w:351px;
  --aw-illo-h:234px;
  --aw-promo-h:454px;
  --aw-band:78px;
  --aw-home:34px;
  --aw-home-w:140px;
  --aw-foot-w:430px;
  --aw-island-w:126px;
  --aw-island-h:37px;

  --awt-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --awt-bg:#FFFFFF;
  --awt-black:#000000;
  --awt-white:#FFFFFF;
  --awt-pass-green:#579B52;
  --awt-pass-blue:#1287FF;
  --awt-key-mask:#D8D8D8;

  /* Ink */
  --awt-gold:#F7E6C0;
  --awt-num:#1D1D1F;
  --awt-hnr:rgba(60,60,67,.6);
  --awt-symbol:#F5F5F7;

  /* Radius */
  --awt-r-phone:42px;
  --awt-r-pass:17.6px;
  --awt-r-key:11px;
  --awt-r-qr:5px;
  --awt-r-pill:100px;

  /* Type */
  --awt-t-m12:510 12px/16px var(--awt-font);
  --awt-t-r14:400 14px/21px var(--awt-font);
  --awt-t-b15:590 15px/20px var(--awt-font);
  --awt-t-r17:400 17px/22px var(--awt-font);
  --awt-t-b17:590 17px/22px var(--awt-font);
  --awt-t-r20:400 20px/24px var(--awt-font);
  --awt-t-b20:590 20px/24px var(--awt-font);
  --awt-t-r22:400 22px/28px var(--awt-font);
  --awt-t-r40:400 40px/41px var(--awt-font);
  --awt-ls-14:.19px;
  --awt-ls-17:.45px;
  --awt-ls-20:.45px;
  --awt-ls-22:.3px;

  /* Metrics */
  --awt-w:390px;
  --awt-h:844px;
  --awt-sb:48px;
  --awt-nav:91px;
  --awt-pass-w:358px;
  --awt-pass-h:502px;
  --awt-key-h:225px;
  --awt-pass-x:16px;
  --awt-pass-y:108px;
  --awt-home-w:134px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--awt-font);background:#fff;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:24px}
.phone{width:var(--awt-w);height:var(--awt-h);position:relative;flex:none;overflow:hidden;border-radius:var(--awt-r-phone);background:var(--awt-bg);color:var(--awt-black);outline:1px solid rgba(0,0,0,.10);box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.ds{position:absolute;left:0;top:0;z-index:9}
.ds path{fill:var(--awt-black)}
.sb{position:absolute;left:0;right:0;top:0;height:var(--awt-sb);z-index:8}
.sb .t{position:absolute;left:21px;top:13.5px;width:54px;height:20px;text-align:center;font:var(--awt-t-b15)}
.nav{position:absolute;left:0;right:0;top:0;height:var(--awt-nav);z-index:8}
.nav .done{position:absolute;left:15.6px;top:56.75px;width:43.68px;letter-spacing:var(--awt-ls-17);font:var(--awt-t-b17)}
.phone>svg,.sb svg,.nav svg{position:absolute;display:block}
.home{position:absolute;left:128px;top:830.5px;z-index:7;width:var(--awt-home-w);height:5px;border-radius:var(--awt-r-pill);background:var(--awt-black)}
.im,.tx,.qr{position:absolute}
.im{display:block;object-fit:cover}
.lg{object-fit:contain}
.tx{white-space:nowrap}
.qr{background:var(--awt-white);border-radius:var(--awt-r-qr)}
.green{color:var(--awt-pass-green)}
.blue{color:var(--awt-pass-blue)}
.white{color:var(--awt-white)}
.sym{color:var(--awt-symbol)}
.key{border-radius:var(--awt-r-key);background:var(--awt-key-mask);filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.hnr{left:112.52px;top:455.005px;letter-spacing:calc(var(--awt-ls-20) + .18px);font:var(--awt-t-r20);color:var(--awt-hnr)}
</style>

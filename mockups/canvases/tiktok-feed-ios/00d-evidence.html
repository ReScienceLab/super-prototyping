<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok feed - Evidence 3/3</title>
<style>
:root{
  /* Font */
  --tf-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --tf-bg:#000;
  --tf-bar:#000;
  --tf-chip:rgba(40,40,40,.41);
  --tf-pill:#FFF;
  --tf-pin:#12BC90;
  --tf-track:rgba(255,255,255,.24);
  --tf-fill:rgba(255,255,255,.75);
  --tf-rest:rgba(255,255,255,.43);
  --tf-rest-track:rgba(255,255,255,.135);
  --tf-play:rgba(255,255,255,.32);

  /* Ink */
  --tf-ink:#FFF;
  --tf-ink-2:rgba(255,255,255,.85);
  --tf-ink-3:rgba(255,255,255,.75);
  --tf-ink-4:rgba(255,255,255,.13);
  --tf-ink-tab:rgba(255,255,255,.8);
  --tf-ink-dark:#000000;

  /* Accent */
  --tf-accent:#FE2C55;
  --tf-cyan:#3BF2FD;
  --tf-save:#FAD016;

  /* Radius */
  --tf-r-phone:52px;
  --tf-r-chip:6px;
  --tf-r-pill:4px;
  --tf-r-track:5.8px;

  /* Type */
  --tf-t-time:590 17px/22px var(--tf-font);
  --tf-t-nav:700 17px/22px var(--tf-font);
  --tf-t-nav-2:600 15px/22px var(--tf-font);
  --tf-t-name:600 17px/22px var(--tf-font);
  --tf-t-copy:400 15px/17.2px var(--tf-font);
  --tf-t-copy-b:600 15px/17.2px var(--tf-font);
  --tf-t-chip:500 13px/16px var(--tf-font);
  --tf-t-chip-2:400 11px/14px var(--tf-font);
  --tf-t-count:600 12px/15px var(--tf-font);
  --tf-t-tab:500 10px/12px var(--tf-font);
  --tf-t-time-big:600 32px/38px var(--tf-font);
  --tf-t-time-sep:600 20px/24px var(--tf-font);
  --tf-t-refresh:700 17px/22px var(--tf-font);
  --tf-t-pill:600 13px/15px var(--tf-font);
  --tf-t-music:400 14px/16px var(--tf-font);

  /* Metrics */
  --tf-w:393px;
  --tf-h:852px;
  --tf-status:54px;
  --tf-gutter:12px;
  --tf-tabbar:82.7px;
  --tf-copy-w:300px;
  --tf-rail-x:362.8px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--tf-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--tf-w);height:var(--tf-h);
  border-radius:var(--tf-r-phone);overflow:hidden;background:var(--tf-bg);color:var(--tf-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--tf-w);height:var(--tf-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--tf-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
body{padding:0;background:#131316;color:var(--tf-ink)}
.sheet{width:478px;height:980px;padding:20px;overflow:hidden}
h1{font:600 17px/22px var(--tf-font);margin-bottom:2px}
header p{font:400 10.5px/14px var(--tf-font);color:var(--tf-ink-3);margin-bottom:14px}
h2{font:600 9px/12px var(--tf-font);letter-spacing:.8px;text-transform:uppercase;
  color:var(--tf-ink-3);margin:12px 0 5px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw .chip{height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.18)}
.sw b{display:block;margin-top:3px;font:600 8.5px/11px ui-monospace,Menlo,monospace}
.sw i{display:block;font:400 8px/11px ui-monospace,Menlo,monospace;
  color:var(--tf-ink-3);font-style:normal;word-break:break-all}
.foot{display:flex;gap:30px;align-items:flex-start}
.foot h2{margin-top:12px}
.rad{display:flex;gap:9px}
.rb{width:44px;height:26px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18)}
.rad em{display:block;margin-top:2px;font:400 8.5px/11px var(--tf-font);
  color:var(--tf-ink-3);font-style:normal;text-align:center}
.tr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-bottom:2px;border-bottom:1px solid rgba(255,255,255,.12)}
.tr span{white-space:nowrap;overflow:hidden}
.tr em{font:400 8px/11px ui-monospace,Menlo,monospace;color:var(--tf-ink-3);
  font-style:normal;white-space:nowrap;flex:none}
.met{font:400 9px/13px ui-monospace,Menlo,monospace;color:var(--tf-ink-2)}
table.ev{width:100%;border-collapse:collapse}
table.ev td{vertical-align:top;padding:2.5px 6px 2.5px 0;
  border-bottom:1px solid rgba(255,255,255,.12);font:400 8.5px/11px var(--tf-font)}
td.t,td.v{font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
td.t{color:var(--tf-accent)}
td.v{color:var(--tf-ink-2);max-width:150px;overflow:hidden;text-overflow:ellipsis}
td.e{color:var(--tf-ink-3)}</style>
</head>
<body>
<div class="sheet"><header><h1>Evidence 3/3</h1><p>One row per token. A token with no evidence is a guess.</p></header><table class="ev"><tr><td class="t">--tf-copy-w</td><td class="v">300px</td><td class="e">caption column: p8's longest line ends 310.03, p7's right-aligned 'less' at 311.82</td></tr><tr><td class="t">--tf-rail-x</td><td class="v">362.8px</td><td class="e">right-rail centre, mean of its five glyph ink boxes</td></tr></table></div>
</body>
</html>

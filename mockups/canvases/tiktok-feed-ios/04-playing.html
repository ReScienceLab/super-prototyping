<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok feed - Playing</title>
<style>
:root{
  /* Font */
  --tf-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --tf-bg:#000;
  --tf-bar:#000;
  --tf-chip:rgba(40,40,40,.41);
  --tf-pill:#FFF;
  --tf-pin:#12BC90;
  --tf-track:rgba(255,255,255,.24);
  --tf-fill:rgba(255,255,255,.75);
  --tf-rest:rgba(255,255,255,.43);
  --tf-rest-track:rgba(255,255,255,.135);
  --tf-play:rgba(255,255,255,.32);

  /* Ink */
  --tf-ink:#FFF;
  --tf-ink-2:rgba(255,255,255,.85);
  --tf-ink-3:rgba(255,255,255,.75);
  --tf-ink-4:rgba(255,255,255,.13);
  --tf-ink-tab:rgba(255,255,255,.8);
  --tf-ink-dark:#000000;

  /* Accent */
  --tf-accent:#FE2C55;
  --tf-cyan:#3BF2FD;
  --tf-save:#FAD016;

  /* Radius */
  --tf-r-phone:52px;
  --tf-r-chip:6px;
  --tf-r-pill:4px;
  --tf-r-track:5.8px;

  /* Type */
  --tf-t-time:590 17px/22px var(--tf-font);
  --tf-t-nav:700 17px/22px var(--tf-font);
  --tf-t-nav-2:600 15px/22px var(--tf-font);
  --tf-t-name:600 17px/22px var(--tf-font);
  --tf-t-copy:400 15px/17.2px var(--tf-font);
  --tf-t-copy-b:600 15px/17.2px var(--tf-font);
  --tf-t-chip:500 13px/16px var(--tf-font);
  --tf-t-chip-2:400 11px/14px var(--tf-font);
  --tf-t-count:600 12px/15px var(--tf-font);
  --tf-t-tab:500 10px/12px var(--tf-font);
  --tf-t-time-big:600 32px/38px var(--tf-font);
  --tf-t-time-sep:600 20px/24px var(--tf-font);
  --tf-t-refresh:700 17px/22px var(--tf-font);
  --tf-t-pill:600 13px/15px var(--tf-font);
  --tf-t-music:400 14px/16px var(--tf-font);

  /* Metrics */
  --tf-w:393px;
  --tf-h:852px;
  --tf-status:54px;
  --tf-gutter:12px;
  --tf-tabbar:82.7px;
  --tf-copy-w:300px;
  --tf-rail-x:362.8px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--tf-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--tf-w);height:var(--tf-h);
  border-radius:var(--tf-r-phone);overflow:hidden;background:var(--tf-bg);color:var(--tf-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--tf-w);height:var(--tf-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--tf-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.t,.b,.a,.ic{position:absolute}
.a,.ic{display:block}
.t{white-space:nowrap}
.mq{position:absolute;overflow:hidden}
.mq span{display:block;white-space:nowrap;font:var(--tf-t-music)}</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill Path - Lesson sheet</title>
<style>
:root{
  /* Font */
  --sp-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --sp-sheet:#FDFDFD;
  --sp-strip:#F5F9FC;
  --sp-level:#E6F7EF;
  --sp-sky-1:#9DCDE8;
  --sp-sky-2:#94C6E2;
  --sp-sky-3:#90C3E2;
  --sp-day-on:#E2E9F5;
  --sp-chip:rgba(255,255,255,.40);
  --sp-chip-on:#F6FAFD;
  --sp-node:#FCFEFF;
  --sp-node-off:#BDD6E4;
  --sp-cta:#5B8BA8;
  --sp-cta-lip:#43708C;
  --sp-scrim:rgba(26,60,74,.415);

  /* Line */
  --sp-dash:#CFDDE9;
  --sp-ring:#DDE3EA;
  --sp-card-edge:#F8F9FB;

  /* Ink */
  --sp-ink:#0E1114;
  --sp-ink-2:#575757;
  --sp-ink-3:#8B959E;
  --sp-ink-4:#B9BBC1;
  --sp-ink-sub:#A4A9AF;
  --sp-ink-sky:#22323E;
  --sp-ink-sky-2:#255471;
  --sp-ink-sky-3:#6795B3;
  --sp-ink-inv:#FDFDFD;
  --sp-ink-hdr:rgba(253,253,253,.72);

  /* Accent */
  --sp-green:#16BE70;
  --sp-green-2:#29BA76;
  --sp-green-pale:#D7FFEE;
  --sp-track-off:#C5ECD7;
  --sp-xp:#3FBE84;
  --sp-tab-on:#E3EDF3;
  --sp-tab-on-ink:#9FB2BF;
  --sp-tab-off-ink:#4E4E4E;
  --sp-play:#5F8AA4;
  --sp-gem:#B23BD8;
  --sp-lock:#80A4BB;

  /* Radius */
  --sp-r-card:28px;
  --sp-r-level:24px;
  --sp-r-row:22px;
  --sp-r-cta:20px;
  --sp-r-pill:999px;
  --sp-r-phone:55px;

  /* Type */
  --sp-t-hero:700 31.5px/38.4px var(--sp-font);
  --sp-t-title:700 24.5px/29.9px var(--sp-font);
  --sp-t-h1:700 17.5px/21.3px var(--sp-font);
  --sp-t-sect:700 17px/20.7px var(--sp-font);
  --sp-t-h2:700 24.5px/29.9px var(--sp-font);
  --sp-t-greet:700 20px/24.4px var(--sp-font);
  --sp-t-count:700 16px/19.5px var(--sp-font);
  --sp-t-node:600 16.6px/20.3px var(--sp-font);
  --sp-t-row:600 15.5px/18.9px var(--sp-font);
  --sp-t-chipname:600 15px/18.3px var(--sp-font);
  --sp-t-cta:700 15px/18.3px var(--sp-font);
  --sp-t-body:500 15px/18.3px var(--sp-font);
  --sp-t-meta:500 13.5px/16.5px var(--sp-font);
  --sp-t-date:400 15.5px/18.9px var(--sp-font);
  --sp-t-sub:400 13px/15.9px var(--sp-font);
  --sp-t-cap:600 11.7px/14.3px var(--sp-font);
  --sp-t-tab:500 12px/14.6px var(--sp-font);
  --sp-t-day:500 11px/13.4px var(--sp-font);
  --sp-t-count2:600 10.7px/13.1px var(--sp-font);
  --sp-t-chip:600 9.3px/11.3px var(--sp-font);
  --sp-t-time:590 17px/22px var(--sp-font);

  /* Metrics */
  --sp-w:402px;
  --sp-h:874px;
  --sp-status:54px;
  --sp-gutter:20px;
  --sp-row:85.2px;
  --sp-road:37px;
  --sp-bend:39px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sp-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
img.a{position:absolute;display:block}
.phone{position:relative;flex:none;width:var(--sp-w);height:var(--sp-h);
  border-radius:var(--sp-r-phone);overflow:hidden;background:var(--sp-sheet);color:var(--sp-ink);
  transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--sp-w);height:var(--sp-status);z-index:9}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--sp-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
.t,.b{position:absolute}
.t{white-space:nowrap;letter-spacing:-.01em}
.sky{position:absolute;left:0;top:0;width:402px}
.card{position:absolute;background:var(--sp-sheet)}
.pill{position:absolute;border-radius:999px}
.road{position:absolute;left:0;top:0;width:402px;height:874px}
.blur{position:absolute;left:0;top:0;width:402px;height:152px;
  background:rgba(157,205,232,.55);
  -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);z-index:4}
.node{position:absolute;width:47px;height:47px;border-radius:24px;
  background:var(--sp-node);box-shadow:0 3px 7px rgba(31,74,97,.16)}
.tabbar{position:absolute;left:23.5px;top:794.3px;width:355px;height:59.7px;
  border-radius:30px;background:var(--sp-sheet);
  box-shadow:0 6px 22px rgba(40,64,80,.13);z-index:6}</style>
</head>

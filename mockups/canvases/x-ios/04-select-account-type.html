<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X iOS - Select an account type</title>
<style>
:root{
  /* Font */
  --x-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --x-ground:#FFFFFF;
  --x-field:#EFF3F4;
  --x-spaces:#7856FE;
  --x-chip:#ECE8FF;
  --x-chip-card:rgba(255,255,255,.30);
  --x-pill-off:#88898D;
  --x-disc-1:rgba(0,0,0,.75);
  --x-disc-7:rgba(0,0,0,.57);
  --x-scrim:rgba(0,0,0,.28);
  --x-backdrop:#000000;
  --x-track-on:#01BA7B;
  --x-track-off:#E9E9E9;
  --x-nav:linear-gradient(96deg,#FDFCFF 0%,#EFE8FF 38%,#EAE0FF 62%,#EFE7FF 100%);

  /* Line */
  --x-hairline:#D2D4D6;
  --x-hairline-2:#C6C6C6;
  --x-border:#D0D8DC;
  --x-ring:#BAC9D0;

  /* Ink */
  --x-ink:#0F1419;
  --x-ink-2:#536471;
  --x-accent:#1D9BF0;
  --x-inv:#FFFFFF;
  --x-ink-off:#C6C7C9;
  --x-save-off:#C5C5C5;
  --x-chip-ink:#291465;

  /* Radius */
  --x-r-phone:52px;
  --x-r-pill:26px;
  --x-r-field:17px;
  --x-r-search:19.5px;
  --x-r-card:16px;
  --x-r-play:16.5px;
  --x-r-chip:4px;
  --x-r-sheet:12px;
  --x-r-peek:10px;

  /* Metrics */
  --x-w:393px;
  --x-h:852px;
  --x-status:54px;
  --x-dim:.31;

  /* Type */
  --x-tr-text:-0.035em;
  --x-t-time:590 17px/22px var(--x-font);
  --x-t-title:800 26px/34px var(--x-font);
  --x-t-space:800 25.5px/31px var(--x-font);
  --x-t-name:800 22px/27px var(--x-font);
  --x-t-card:700 19px/24px var(--x-font);
  --x-t-field:400 18.5px/24px var(--x-font);
  --x-t-sheet:700 18.5px/24px var(--x-font);
  --x-t-sect:800 19.3px/24px var(--x-font);
  --x-t-save:700 17.5px/22px var(--x-font);
  --x-t-head:800 18.25px/22px var(--x-font);
  --x-t-btn:700 16.5px/21px var(--x-font);
  --x-t-body:400 16px/21px var(--x-font);
  --x-t-date:700 16px/21px var(--x-font);
  --x-t-row:700 15.5px/21px var(--x-font);
  --x-t-note:400 15.5px/21px var(--x-font);
  --x-t-pill:700 15px/20px var(--x-font);
  --x-t-desc:400 14.5px/15.67px var(--x-font);
  --x-t-meta:400 13.5px/19px var(--x-font);
  --x-t-host:800 14.5px/18px var(--x-font);
  --x-t-count:400 14px/19px var(--x-font);
  --x-t-badge:400 12.5px/16px var(--x-font);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--x-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--x-w);height:var(--x-h);
  border-radius:var(--x-r-phone);overflow:hidden;background:var(--x-ground);color:var(--x-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:100%;height:var(--x-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--x-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.t,.b,.a,.ic{position:absolute}
.a,.ic{display:block}
.ic{overflow:visible}
.t{white-space:nowrap}
.t a{color:var(--x-accent);text-decoration:none}</style>
</head>
<body>

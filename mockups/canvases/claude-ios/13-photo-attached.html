<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claude iOS - Photo attached</title>
<style>
:root{
  /* Font */
  --c-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --c-serif:Georgia,"Iowan Old Style",Charter,"Times New Roman",serif;

  /* Surface */
  --c-bg:#FBF9F5;
  --c-card:#FBFAF7;
  --c-fill:#EFEEE6;
  --c-raised:#FEFCFB;
  --c-white:#FFFFFF;
  --c-kbd:#E3E3E5;
  --c-scrim:rgba(0,0,0,.20);

  /* Line */
  --c-hairline:#C8C6C2;
  --c-border:#E3E2DE;

  /* Ink */
  --c-ink:#12100F;
  --c-ink-2:#44423E;
  --c-ink-3:#767470;
  --c-ink-4:#ABAAA6;
  --c-ink-inv:#FFFFFF;
  --c-placeholder:#73736E;

  /* Accent */
  --c-accent:#D97757;
  --c-send:#CB6442;
  --c-switch:#2C83DA;

  /* Voice */
  --c-v-blue-1:#B6C9DE;
  --c-v-blue-2:#ACC3DD;
  --c-v-warm-1:#E9AD98;
  --c-v-warm-2:#EAA087;
  --c-v-deep-1:#C0C9D8;
  --c-v-deep-2:#B8C2D5;
  --c-voice-ink:#76797C;

  /* Radius */
  --c-r-comp:24px;
  --c-r-bubble:13px;
  --c-r-card:14px;
  --c-r-sheet:47px;
  --c-r-key:5px;
  --c-r-pill:999px;
  --c-r-phone:52px;

  /* Type */
  --c-t-nav:400 18px/22px var(--c-serif);
  --c-t-body:400 18px/24px var(--c-font);
  --c-t-cap:400 15.5px/20px var(--c-font);
  --c-t-note:400 13px/16.7px var(--c-font);
  --c-t-key:400 22px/43px var(--c-font);
  --c-t-serif:400 17.8px/25.5px var(--c-serif);
  --c-t-h1:700 29px/36.3px var(--c-serif);
  --c-t-h2:700 25px/31px var(--c-serif);
  --c-t-hero:400 29.3px/36.3px var(--c-serif);
  --c-t-list:700 25.5px/31px var(--c-serif);
  --c-t-time:590 17px/22px var(--c-font);

  /* Metrics */
  --c-w:393px;
  --c-h:852px;
  --c-status:54px;
  --c-nav:103px;
  --c-gutter:16px;
  --c-pad:21.3px;
  --c-comp-w:369px;
  --c-tap:44px;
  --c-kbd-top:545px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--c-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--c-w);height:var(--c-h);
  border-radius:var(--c-r-phone);overflow:hidden;background:var(--c-bg);color:var(--c-ink);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--c-w);height:var(--c-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--c-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}

/* nav: two 44pt circles at top 59, the model name centred, its chevron beside it */
.nav{position:absolute;left:0;top:0;width:var(--c-w);height:var(--c-nav);z-index:5}
.nbtn{position:absolute;top:59px;width:var(--c-tap);height:var(--c-tap);border-radius:22px;
  background:var(--c-raised);display:flex;align-items:center;justify-content:center}
.nbtn.l{left:var(--c-gutter)}
.nbtn.r{left:333px}
.ntitle{position:absolute;left:0;top:68.13px;width:var(--c-w);text-align:center;
  font:var(--c-t-nav)}
.nchev{position:absolute;left:241.1px;top:66.7px}
.nslid{position:absolute;left:348.3px;top:68px}
/* the menu mark: three 1.7pt lines on a 5.15 pitch, 16 / 16 / 7.4 long */
.menu{position:absolute;left:14px;top:16px;width:16px;height:12px}
.menu i{position:absolute;left:0;height:1.7px;border-radius:1px;background:currentColor}

/* home: the mark, then the two-line greeting. Both sit on the midpoint of the
   space between the nav and the composer, plus 4pt, which is one formula
   across all five home screens: star_top = (103 + comp_top) / 2 - 61.35. */
.hero{position:absolute;left:0;width:var(--c-w);text-align:center;z-index:1}
.hero svg{margin:0 auto}
.hero .hl{margin-top:12.34px;font:var(--c-t-hero)}

/* composer: 369 wide at left 12, bottom-anchored. A blur material with a soft
   shadow above and below it. Text ink lands 76.7 above the card's bottom edge
   and the 36pt button row 7 above it, on every one of the fifteen. */
.comp{position:absolute;left:12px;width:var(--c-comp-w);border-radius:var(--c-r-comp);
  background:var(--c-card);z-index:4;
  box-shadow:0 -8px 22px rgba(66,52,36,.055),0 12px 26px rgba(66,52,36,.075)}
.comp .txt{position:absolute;left:14px;right:14px;bottom:60.6px;height:24px;
  font:var(--c-t-body);white-space:nowrap;overflow:hidden}
.comp .caret{display:inline-block;width:1.7px;height:21px;background:var(--c-ink);
  vertical-align:-4.5px;margin-left:1px}
.comp .btns{position:absolute;left:8px;right:8px;bottom:7px;height:36px}
.cbtn{position:absolute;top:0;width:36px;height:36px;border-radius:18px;
  display:flex;align-items:center;justify-content:center}
.cbtn.plus{left:0}
.cbtn.mic{left:271.2px}
.cbtn.act{left:317px}
.stop{width:14px;height:14px;border-radius:3px;background:#fff}
/* the attachment: 80pt square, 8.3 in from the card's left, 6.3 down from its top */
.att{position:absolute;left:8.3px;top:6.3px;width:80px;height:80px}
.att .in{width:80px;height:80px;border-radius:var(--c-r-card);overflow:hidden;
  background:var(--c-white)}
.att img,.doc img{width:100%;height:100%;display:block;object-fit:cover}
.attx{position:absolute;left:48px;top:5.7px;width:26px;height:26px;border-radius:13px;
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(66,52,36,.16)}
/* the attached-file card: 96 in the sent bubble, scaled to 80 on the composer */
.doc{width:96px;height:96px;padding:4.2px 9.7px 9px;display:flex;flex-direction:column;
  justify-content:space-between;background:var(--c-white);
  border-radius:var(--c-r-card);overflow:hidden}
.doc b{font:500 12.3px/16.7px var(--c-font);color:var(--c-ink)}
.doc i{align-self:flex-start;font:600 11px/17px var(--c-font);font-style:normal;
  color:var(--c-ink-2);border:.7px solid var(--c-border);border-radius:6px;padding:0 5.5px}
.att .doc{transform:scale(.8333);transform-origin:0 0}

/* conversation */
.chat{position:absolute;left:0;width:var(--c-w);z-index:1}
.bub{margin:0 16px 0 auto;width:max-content;max-width:316px;background:var(--c-fill);
  border-radius:var(--c-r-bubble);height:49px;padding:11.13px 16px 0;
  font:var(--c-t-body)}
.sent{margin:0 16px 8px auto;width:96px;height:96px}

/* the answer. Serif, 17.8/25.5, left edge 21.3, every wrap forced with <br> so
   a substituted face cannot re-break a line the capture broke elsewhere. */
.ans{position:absolute;left:var(--c-pad);width:358px;font:var(--c-t-serif);z-index:1}
.ans h1{font:var(--c-t-h1);letter-spacing:-.045em}
.ans h2{font:var(--c-t-h2);letter-spacing:-.045em}
.ans>*+*{margin-top:8.4px}
.ans>p+h2,.ans>ul+h2,.ans>ol+h2{margin-top:5.7px}
.ans>h1+p,.ans>h2+p,.ans>h2+ol,.ans>h2+ul{margin-top:10.3px}
.ans>h1+h2{margin-top:8.25px}
.ans ol,.ans ul{list-style:none}
.ans li{position:relative}
.ans li+li{margin-top:8.2px}
.ans ol li{padding-left:29.3px}
.ans ul li{padding-left:39.7px}
.ans .m{position:absolute;left:0;width:22px;text-align:right}
.ans ul .m{left:22px;width:8px;text-align:center}

/* the thinking mark: the same asterisk at 25.3, one line under the bubble */
.tstar{position:absolute;left:20px;z-index:1}
/* below the composer the answer keeps scrolling under a vibrancy veil:
   ink #0D0B09 reads #C6C4C2 and the ground #FCFAF6 reads #F6F4F2, which
   solves to rgba(245,243,240,.80) over both. */
.tail{position:absolute;left:0;bottom:0;width:var(--c-w);height:35px;
  background:rgba(245,243,240,.8);z-index:2}

/* the scroll-to-latest chip: 36 across, centred, 50 above the composer */
.chip{position:absolute;left:178.5px;top:668px;width:36px;height:36px;border-radius:18px;
  background:#FEFDFB;display:flex;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 2px 12px rgba(66,52,36,.11)}</style>
</head>

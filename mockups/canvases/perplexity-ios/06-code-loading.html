<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perplexity iOS - Code accepted</title>
<style>
:root{
  /* Font */
  --pp-font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --pp-serif:"Bodoni 72","Bodoni MT",Didot,ui-serif,"New York",Georgia,serif;
  --pp-mono:ui-monospace,Menlo,"SF Mono",monospace;

  /* Surface */
  --pp-bg:#FFFDFC;
  --pp-night:#1B181C;
  --pp-night-2:#1A191C;
  --pp-card:#F6F4F0;
  --pp-chip:#252527;
  --pp-pill:#FFFDFF;
  --pp-pill-2:#302D31;
  --pp-kbd:#D3D5DB;
  --pp-key:#FFFDFE;
  --pp-key-mod:#ACB1BD;
  --pp-search:#EAE9E5;
  --pp-ring:#ECEAE8;
  --pp-off:#E2E0DF;
  --pp-alert:radial-gradient(circle 135px at 50% 50%,#EFECF0 0%,#E6E3E7 40%,#CFCCD0 100%);
  --pp-scrim:rgba(0,0,0,.355);

  /* Line */
  --pp-border:#DBDAD6;
  --pp-line:#646464;
  --pp-line-on:#56ACBC;
  --pp-line-chip:#404042;

  /* Ink */
  --pp-ink:#142C2F;
  --pp-ink-2:#8B8987;
  --pp-ink-3:#969598;
  --pp-ink-4:#BDBBB9;
  --pp-ink-inv:#FFFDFF;
  --pp-ink-max:#000000;
  --pp-ink-cyan:#0C3A44;
  --pp-idle:#8E8C8B;
  --pp-globe:#4D4F57;
  --pp-quiet:#ACABA8;
  --pp-wash:#F8F6F5;

  /* Accent */
  --pp-accent:#207F8E;
  --pp-accent-2:#2C777F;
  --pp-caret:#2E7C86;
  --pp-cyan:#21BAD2;
  --pp-cyan-2:#48B2C4;
  --pp-gold:#FFD4AA;
  --pp-gold-ink:#2B1101;
  --pp-blue:#017BFF;
  --pp-danger:#F1412B;
  --pp-flag:#F44041;

  /* Radius */
  --pp-r-field:12px;
  --pp-r-card:13px;
  --pp-r-badge:6px;
  --pp-r-key:5px;
  --pp-r-chip:4px;
  --pp-r-alert:14px;
  --pp-r-pill:999px;
  --pp-r-phone:52px;

  /* Type */
  --pp-t-nav:400 24.9px/24.9px var(--pp-font);
  --pp-t-title:400 20.9px/20.9px var(--pp-font);
  --pp-t-body:400 16.3px/20.6px var(--pp-font);
  --pp-t-btn:500 18px/18px var(--pp-font);
  --pp-t-field:350 17px/17px var(--pp-font);
  --pp-t-chip:400 14.4px/40px var(--pp-font);
  --pp-t-plan:600 16px/16px var(--pp-font);
  --pp-t-price:400 25.2px/25.2px var(--pp-font);
  --pp-t-foot:400 15px/15px var(--pp-font);
  --pp-t-note:400 12px/12px var(--pp-font);
  --pp-t-key:400 24.7px/35.4px var(--pp-font);
  --pp-t-key-2:400 16.2px/39.9px var(--pp-font);
  --pp-t-hero:400 33px/36px var(--pp-serif);
  --pp-t-home:400 29.8px/35.3px var(--pp-serif);
  --pp-t-time:590 17px/22px var(--pp-font);

  /* Metrics */
  --pp-w:393px;
  --pp-h:852px;
  --pp-status:54px;
  --pp-gutter:24px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--pp-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--pp-w);height:var(--pp-h);
  border-radius:var(--pp-r-phone);overflow:hidden;background:var(--pp-bg);color:var(--pp-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--pp-w);height:var(--pp-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--pp-t-time)}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.phone svg,.phone img{position:absolute;display:block}
.b,.t,.ct{position:absolute}
.t,.ct{white-space:nowrap}
.ct{left:0;width:var(--pp-w);text-align:center}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;gap:5px;
  border-radius:var(--pp-r-pill);font:var(--pp-t-btn)}
/* the substitute seats a flex-centred line half a point below where the
   capture puts its ink: its ascent and descent split the line box
   differently from the real face */
.lb{position:relative;top:-.5px}
.gl{position:relative;flex:none}
.fld{position:absolute;background:var(--pp-card);border:1px solid var(--pp-border);
  border-radius:var(--pp-r-field)}
.k,.km,.k2,.km2,.kb{position:absolute;height:42.3px;border-radius:var(--pp-r-key);
  text-align:center;color:var(--pp-ink);background:var(--pp-key);font:var(--pp-t-key);
  box-shadow:0 1px 0 rgba(20,18,24,.26)}
.km,.km2{background:var(--pp-key-mod)}
.k2,.km2{font:var(--pp-t-key-2)}
.kb{background:var(--pp-blue);color:#FFFFFF;font:var(--pp-t-key-2)}
.chips{position:absolute;top:0;display:flex;gap:7px}
.chips span{display:block;flex:none;white-space:nowrap;font:var(--pp-t-chip);
  height:40px;padding:0 15.4px;box-sizing:border-box;
  border:.33px solid var(--pp-line-chip);border-radius:var(--pp-r-chip);
  background:var(--pp-chip);color:var(--pp-ink-inv)}
.tabs svg{color:var(--pp-idle)}</style>
</head>

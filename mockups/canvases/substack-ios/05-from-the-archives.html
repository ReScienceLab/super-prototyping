<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Substack iOS - From the archives</title>
<style>
:root{
  /* Font */
  --s-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --s-bg:#FFFFFF;
  --s-card:#FDFDFD;
  --s-fill:#EFEFEF;
  --s-tint:rgba(0,0,0,.075);
  --s-glass:rgba(255,255,255,.66);
  --s-peach:#FEDFC3;
  --s-grad-a:#FDFDFD;
  --s-grad-b:#E7E7E7;
  --s-band:#D6D6D6;

  /* Line */
  --s-hairline:#C7C7C7;
  --s-border:#DDDDDD;

  /* Ink */
  --s-ink:#373737;
  --s-ink-2:#787878;
  --s-ink-inv:#FFFFFF;
  --s-link:#097FC6;

  /* Accent */
  --s-accent:#FF5800;
  --s-live:#FF4850;

  /* Radius */
  --s-r-card:12px;
  --s-r-tile:8px;
  --s-r-pill:999px;
  --s-r-phone:52px;

  /* Type */
  --s-t-body:400 15px/20px var(--s-font);
  --s-t-name:600 15px/20px var(--s-font);
  --s-t-toast:700 14.5px/19.33px var(--s-font);
  --s-t-meta:400 10.5px/14px var(--s-font);
  --s-t-sub:500 10.5px/14px var(--s-font);
  --s-t-tile:400 11px/14px var(--s-font);
  --s-t-badge:600 11.5px/14px var(--s-font);
  --s-t-live:700 9px/12px var(--s-font);
  --s-t-small:400 13px/17px var(--s-font);
  --s-t-label:600 13px/17px var(--s-font);
  --s-t-pub:700 13px/17px var(--s-font);
  --s-t-help:400 14px/19px var(--s-font);
  --s-t-btn:500 14px/19px var(--s-font);
  --s-t-head:600 20.5px/25px var(--s-font);
  --s-t-share:600 21.5px/26px var(--s-font);
  --s-t-time:590 16.75px/22px var(--s-font);

  /* Metrics */
  --s-w:393px;
  --s-h:852px;
  --s-status:54px;
  --s-gutter:16px;
  --s-avatar:40px;
  --s-tab:62.33px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--s-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--s-w);height:var(--s-h);
  border-radius:var(--s-r-phone);overflow:hidden;background:var(--s-bg);color:var(--s-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--s-w);height:var(--s-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--s-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.t,.b,.i,.a{position:absolute}
/* No fill here: a CSS fill would beat the fill="none" the stroke icons set. */
.i,.fi{display:block}
.a{display:block}
.t{white-space:nowrap}
.d{color:var(--s-ink-2)}
.sb2{font-weight:500;color:var(--s-accent)}
a{color:var(--s-link);text-decoration:none}
i{font-style:italic}
b{font-weight:600;letter-spacing:-.03px}
.ck{display:inline-block}
.act{position:absolute;left:16.33px;display:flex;align-items:flex-start;gap:29px}
.act span{display:flex;align-items:flex-start;gap:6.8px}
.act .c{font:var(--s-t-small);color:var(--s-ink-2);white-space:nowrap}
.pill,.srch{position:absolute;background:var(--s-glass);z-index:3;
  backdrop-filter:blur(4px) saturate(3);-webkit-backdrop-filter:blur(4px) saturate(3);
  box-shadow:0 4px 18px rgba(0,0,0,.09),inset 0 0 0 1px rgba(255,255,255,.7)}
.pill{left:21px;top:768.67px;width:281px;height:62.33px;border-radius:31.17px}
.srch{left:310px;top:769px;width:62px;height:62px;border-radius:50%}
.pill~.i,.srch~.i{z-index:5}
.live{position:absolute;width:26.67px;height:12px;border-radius:3.5px;
  /* Substack's badge face is narrower than the UI one: at the size its cap
     height fits, LIVE sets 1pt wide, so the tracking carries the difference. */
  background:var(--s-live);box-shadow:0 0 0 1.33px #FFF;letter-spacing:-.35px;
  display:flex;align-items:center;justify-content:center;
  font:var(--s-t-live);color:var(--s-ink-inv)}
.bdg{position:absolute;z-index:5;border-radius:50%;background:var(--s-accent);
  display:flex;align-items:center;justify-content:center;
  font:var(--s-t-badge);color:var(--s-ink-inv)}
.fab{position:absolute;left:312.67px;top:695.67px;width:56.67px;height:56.67px;
  border-radius:50%;background:var(--s-accent);z-index:5}</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotify - Jam invitation</title>
<style>
:root{
  /* Font */
  --s-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --s-bg:#111111;
  --s-bg-deep:#030003;
  --s-chip:#333333;
  --s-chip-sel-line:#EBECE9;
  --s-jam-top:#121212;
  --s-jam-bot:#8A0C56;
  --s-codes-top:#A2C6A8;
  --s-codes-mid:#526859;
  --s-codes-bot:#151716;

  /* Ink */
  --s-ink:#FFFFFF;
  --s-ink-2:#BABABA;
  --s-ink-3:#B6B6B6;
  --s-ink-on-accent:#000000;
  --s-ink-fine:#DE97C3;
  --s-dot:#575457;

  /* Accent */
  --s-green:#1ED860;
  --s-avatar:#19E78D;
  --s-purple:#8500EA;
  --s-pink:#F237A6;

  /* Radius */
  --s-r-card:4px;
  --s-r-modal:4px;
  --s-r-promo:8px;
  --s-r-codes:0px;
  --s-r-pill:999px;

  /* Type */
  --s-t-h1:700 24px/30px var(--s-font);
  --s-t-h1-promo:600 25px/31.2px var(--s-font);
  --s-t-h2:700 24px/31px var(--s-font);
  --s-t-title:700 32px/34px var(--s-font);
  --s-t-modal-h:700 24px/28px var(--s-font);
  --s-t-body:400 16px/20px var(--s-font);
  --s-t-body-sm:400 13px/18px var(--s-font);
  --s-t-row:400 16px/20px var(--s-font);
  --s-t-sub:400 13px/18px var(--s-font);
  --s-t-caption:400 13px/17px var(--s-font);
  --s-t-chip:500 13px/17px var(--s-font);
  --s-t-btn:700 16px/20px var(--s-font);
  --s-t-btn-caps:700 13px/17px var(--s-font);
  --s-t-dismiss:700 15px/20px var(--s-font);
  --s-t-tab:500 11px/14px var(--s-font);
  --s-t-time:590 17px/22px var(--s-font);

  /* Metrics */
  --s-w:393px;
  --s-h:852px;
  --s-status:54px;
  --s-gutter:16px;
  --s-rail:17.9px;
  --s-card:144.7px;
  --s-pitch:165.1px;
  --s-thumb:48px;
  --s-row:62.2px;
  --s-tab:98.25px;
  --s-chip-h:32px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--s-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
img.a{position:absolute;display:block}
.phone{position:relative;flex:none;width:var(--s-w);height:var(--s-h);
  border-radius:52px;overflow:hidden;background:var(--s-bg);color:var(--s-ink);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--s-w);height:var(--s-status);z-index:8}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--s-t-time)}
.sb svg{position:absolute;display:block;fill:currentColor}
.t{position:absolute;white-space:nowrap}
.modal{position:absolute;left:29.5px;top:182.5px;width:334px;height:486.3px;
  border-radius:var(--s-r-modal);z-index:2;
  background:linear-gradient(180deg,var(--s-jam-top) 0,var(--s-jam-top) 59.5%,
    var(--s-jam-bot) 100%)}
.mark{position:absolute;left:185.2px;top:119.2px;width:22.8px;height:22.8px;z-index:3;
  border-radius:50%;background:#fff}
.mark svg{position:absolute;left:3.3px;top:5.6px;width:16.2px;height:11.6px;fill:#000}
.pill{position:absolute;border-radius:var(--s-r-pill);z-index:3;
  font:var(--s-t-btn);display:flex;align-items:center;justify-content:center}
/* Everything emitted after the modal belongs on top of it. A positioned
   element with z-index:auto loses to the modal's 2 whatever the DOM order,
   so the content has to name a layer of its own. */
.modal~.t,.modal~img.a{z-index:3}</style>
</head>

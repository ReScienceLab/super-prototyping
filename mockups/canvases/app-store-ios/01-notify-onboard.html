<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Store - Notifications onboarding</title>
<style>
:root{
  /* Font */
  --as-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --as-bg:#FFFFFF;
  --as-fill:#EEEEEF;
  --as-fill-2:#EBEBEB;
  --as-chip:#FFFFFF;
  --as-circle:#F9F9FA;
  --as-tint:#EDF6FF;
  --as-badge:#86C0FD;
  --as-sky:linear-gradient(#023254,#034B72 41%,#04608A 72%,#056792 85%,#1A719E);
  --as-scrim:rgba(0,0,0,.20);
  --as-group:#F2F2F6;
  --as-haze:#F9FAFA;
  --as-disc:#FAFAFB;
  --as-disc-2:#F5F5F9;
  --as-back:#E0E0E0;
  --as-alert:rgba(255,255,255,.60);
  --as-alert-btn:rgba(0,0,0,.12);

  /* Line */
  --as-hairline:#DFDFDF;
  --as-border:#B0AFB0;
  --as-sep:#E7E7E8;

  /* Ink */
  --as-ink:#000000;
  --as-ink-2:#8A8A8E;
  --as-ink-3:#BFBFBF;
  --as-ink-inv:#FFFFFF;
  --as-ink-dim:#707172;
  --as-ink-note:#85858B;
  --as-ink-ph:#BCBCC1;
  --as-ink-chev:#C5C5C7;
  --as-ink-alert:#838383;

  /* Accent */
  --as-accent:#0082F7;
  --as-accent-2:#0088FE;
  --as-accent-3:#007AFF;

  /* Radius */
  --as-r-card:26px;
  --as-r-sheet:38px;
  --as-r-alert:34px;
  --as-r-chip:18.5px;
  --as-r-pill:999px;
  --as-r-phone:62px;

  /* Type */
  --as-t-title:700 34px/41px var(--as-font);
  --as-t-section:700 21px/26px var(--as-font);
  --as-t-group:700 16px/20px var(--as-font);
  --as-t-row:400 16px/18px var(--as-font);
  --as-t-sub:400 12px/21px var(--as-font);
  --as-t-chip:600 14px/19px var(--as-font);
  --as-tr-tight:-0.2px;
  --as-t-cta:600 15px/20px var(--as-font);
  --as-t-iap:400 8px/11px var(--as-font);
  --as-t-head:600 21px/26px var(--as-font);
  --as-t-headsub:400 22px/26px var(--as-font);
  --as-t-eyebrow:700 11px/16px var(--as-font);
  --as-tr-head:-0.5px;
  --as-t-ssub:400 14px/18px var(--as-font);
  --as-t-ph:400 16px/20px var(--as-font);
  --as-t-ad:600 10px/13px var(--as-font);
  --as-t-tab:500 10px/12px var(--as-font);
  --as-t-hero:700 26px/32px var(--as-font);
  --as-t-btn:600 16.5px/22px var(--as-font);
  --as-t-foot:400 12px/16px var(--as-font);
  --as-t-areye:600 12px/16px var(--as-font);
  --as-t-pane:700 27px/32px var(--as-font);
  --as-t-lede:400 21px/26px var(--as-font);
  --as-t-go:600 16px/22px var(--as-font);
  --as-t-link:600 16px/22px var(--as-font);
  --as-t-body:400 16px/22px var(--as-font);
  --as-t-sheet:600 17px/22px var(--as-font);
  --as-t-note:400 12px/14px var(--as-font);
  --as-t-signin:700 21px/28px var(--as-font);
  --as-t-alert:600 17px/22px var(--as-font);
  --as-t-alert-msg:400 15px/20px var(--as-font);
  --as-t-alert-btn:500 17px/22px var(--as-font);
  --as-t-time:590 17px/22px var(--as-font);

  /* Metrics */
  --as-w:402px;
  --as-h:874px;
  --as-status:62px;
  --as-gutter:20px;
  --as-icon:62px;
  --as-bar-w:361px;
  --as-bar-h:62.7px;
  --as-bar-top:790.5px;
  --as-tab-pitch:68.7px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--as-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--as-w);height:var(--as-h);
  border-radius:var(--as-r-phone);overflow:hidden;background:var(--as-bg);color:var(--as-ink);
  transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--as-w);height:var(--as-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--as-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* the one change for a 402pt frame: the template's glyphs, moved as a group */
.sb .glyphs{position:absolute;left:6px;top:0}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.scroll{position:absolute;left:0;top:0;width:var(--as-w);height:var(--as-h)}
.scroll img{position:absolute;display:block}

h1.big{position:absolute;left:20px;top:62.6px;font:var(--as-t-title);letter-spacing:.37px}
.acct{position:absolute;left:342px;top:62px;width:44px;height:44px;border-radius:22px;
  background:var(--as-circle);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.10)}
.acct svg{position:absolute;left:12.7px;top:12.3px;width:18.3px;height:19.3px;
  display:block;fill:currentColor}

/* floating tab bar: one stadium, five tabs, the selected one on a capsule */
.bar{position:absolute;left:20.5px;top:790.5px;width:var(--as-bar-w);height:var(--as-bar-h);
  border-radius:31.35px;z-index:5;background:rgba(255,255,255,.60);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 4px 16px rgba(0,0,0,.05)}
.bar .cap{position:absolute;top:4.5px;width:77px;height:54px;border-radius:27px;
  background:var(--as-fill-2)}
.bar i{position:absolute;display:block;background:currentColor;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.bar b{position:absolute;top:39.4px;width:80px;margin-left:-40px;text-align:center;
  font:var(--as-t-tab);letter-spacing:.06px}
.bar .t{color:var(--as-ink)}
.bar .t.on{color:var(--as-accent)}
.dim{position:absolute;left:0;top:0;width:var(--as-w);height:var(--as-h);
  background:var(--as-scrim);z-index:7}
.sheet{position:absolute;left:0;width:var(--as-w);overflow:hidden;z-index:8;background:var(--as-bg);
  border-radius:var(--as-r-sheet) var(--as-r-sheet) var(--as-r-phone) var(--as-r-phone)}
.sheet>div{position:absolute;left:0;width:var(--as-w);height:var(--as-h)}
.sheet img{position:absolute;display:block}
.tx{position:absolute;white-space:nowrap}
.mid{left:0;width:var(--as-w);text-align:center}
.close{position:absolute;top:78px;width:44px;height:44px;border-radius:22px;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),inset 0 2px 2px -1px #fff,inset 0 -2px 2px -1px #fff}
.close img{left:10px;top:10.33px;width:24px;height:24px}
.go{position:absolute;height:53px;border-radius:26.5px;background:var(--as-accent-2);
  color:var(--as-ink-inv);font:var(--as-t-go);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1.5px 1.5px -.5px #0CD3FF,inset 0 -1.5px 1.5px -.5px #0CD3FF}
.pane{font:var(--as-t-pane)}
.lede{font:var(--as-t-lede);color:var(--as-ink-2)}
.link{font:var(--as-t-link);color:var(--as-accent-2)}</style>
</head>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--tf-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--tf-w);height:var(--tf-h);

.sb{position:absolute;left:0;top:0;width:var(--tf-w);height:var(--tf-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--tf-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);

.t,.b,.a,.ic{position:absolute}
.a,.ic{display:block}
.t{white-space:nowrap}
.mq{position:absolute;overflow:hidden}
.mq span{display:block;white-space:nowrap;font:var(--tf-t-music)}</style>

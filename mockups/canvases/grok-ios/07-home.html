<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grok iOS - SuperGrok home</title>
<style>
:root{
  /* Font */
  --k-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --k-ground:#D5D5D5;
  --k-card:#FFFFFF;
  --k-well:#E5E5E5;
  --k-dim:#CBCBCB;
  --k-sheet:#F6F6F6;
  --k-illo-frame:#AAAAAA;
  --k-illo-screen:#FAFAFA;
  --k-illo-tile:#DDDDDD;
  --k-illo-scrim:rgba(0,0,0,.12);
  --k-illo-grabber:#CCCCCC;
  --k-night:#010101;
  --k-skip:#121212;
  --k-material:rgba(255,255,255,.067);
  --k-disc:rgba(255,255,255,.17);
  --k-price:#131313;
  --k-plan-lo:#282828;
  --k-plan-hi:#333536;
  --k-free-bg:#341A0E;
  --k-scrim-btn:rgba(0,0,0,.32);
  --k-glass:rgba(255,255,255,.09);
  --k-grabber:rgba(255,255,255,.35);
  --k-sheet-v:rgba(0,0,0,.40);
  --k-side-ink:#CDCECF;
  --k-voice-pill:#767676;
  --k-rec:#F09540;
  --k-page:#FFFFFF;
  --k-chip:#F5F5F5;
  --k-composer:#FBFBFB;
  --k-ctl:#F1F1F1;
  --k-btn:#000000;

  /* Line */
  --k-material-line:rgba(255,255,255,.16);
  --k-price-line:#252525;
  --k-plan-line:rgba(255,255,255,.17);
  --k-composer-shadow:rgba(0,0,0,.12);
  --k-composer-line:#FFFFFF;
  --k-illo-card-shadow:rgba(0,0,0,.24);
  --k-row-line:rgba(255,255,255,.10);
  --k-illo-sheet-shadow:rgba(0,0,0,.12);

  /* Ink */
  --k-ink:#000000;
  --k-ink-inv:#FFFFFF;
  --k-mute:#A9A9A9;
  --k-skip-ink:#BBBBBB;
  --k-foot:#838383;
  --k-free-ink:#E07D54;
  --k-dots:#C5C5C5;
  --k-copy-mute:#7F7F7F;
  --k-placeholder:#7D7D7D;
  --k-field-ink:#6A6A6B;
  --k-card-ink:#262627;
  --k-para-ink:#53584E;
  --k-illo-label:#333333;
  --k-illo-sub:#5A5A5A;
  --k-dim-inv:#CCCCCC;
  --k-new-ink:#FB630A;

  /* Radius */
  --k-r-phone:52px;
  --k-r-widget:27px;
  --k-r-card:26px;
  --k-r-sheet:30px;
  --k-r-illo:53.5px;
  --k-r-illo-tile:14.3px;
  --k-r-illo-sheet:26.8px;
  --k-r-illo-card:22px;
  --k-r-sheet-v:35px;
  --k-r-row:13px;
  --k-r-feat:32px;
  --k-r-price:18px;
  --k-r-plan:15px;
  --k-r-chip:24px;
  --k-r-composer:20px;
  --k-r-tip:14px;
  --k-r-pill:999px;

  /* Type */
  --k-t-time:600 15px/20px var(--k-font);
  --k-t-widget:600 19.5px/24px var(--k-font);
  --k-t-h:600 17px/22px var(--k-font);
  --k-t-body:400 17px/22px var(--k-font);
  --k-t-feat:400 17.5px/22px var(--k-font);
  --k-t-row:400 16.5px/21px var(--k-font);
  --k-t-sheet:600 16px/21px var(--k-font);
  --k-t-h1:500 40.5px/50px var(--k-font);
  --k-t-h2:600 20px/25px var(--k-font);
  --k-t-sub:400 13.25px/18px var(--k-font);
  --k-t-plan:600 15px/20px var(--k-font);
  --k-t-unit:400 15.4px/20px var(--k-font);
  --k-t-price:700 20px/26px var(--k-font);
  --k-t-free:700 12.5px/14px var(--k-font);
  --k-t-title:600 22px/28px var(--k-font);
  --k-t-copy:400 15px/20px var(--k-font);
  --k-t-link:400 17.5px/22px var(--k-font);
  --k-t-hdr:500 22px/28px var(--k-font);
  --k-t-chip:500 15px/20px var(--k-font);
  --k-t-ctl:400 14px/18px var(--k-font);
  --k-t-speak:600 14.5px/18px var(--k-font);
  --k-t-btn:600 16.5px/22px var(--k-font);
  --k-t-card:400 22px/25px var(--k-font);
  --k-t-h3:600 18.9px/24px var(--k-font);
  --k-t-para:400 16.15px/21px var(--k-font);
  --k-t-field:400 16.3px/22px var(--k-font);
  --k-t-opt:400 16px/20px var(--k-font);
  --k-t-key:400 22px/28px var(--k-font);
  --k-t-key-sm:400 18px/22px var(--k-font);
  --k-t-new:500 13px/16px var(--k-font);
  --k-t-illo-label:500 11.5px/14px var(--k-font);
  --k-t-illo-title:600 21.25px/26px var(--k-font);
  --k-t-illo-sub:400 11.25px/15px var(--k-font);
  --k-t-illo-pill:600 15.5px/20px var(--k-font);

  /* Metrics */
  --k-w:393px;
  --k-h:852px;
  --k-status:54px;
  --k-gutter:16px;
  --k-gutter-w:20px;
  --k-tap:44px;
  --k-sheet-top:59px;
  --k-sheet-top-v:403.6px;
  --k-widget:162.4px;
  --k-disc:40px;
  --k-w-max:430px;
  --k-h-max:932px;
  --k-sheet-v-blur:4px;
  --k-illo-stroke:10px;
  --k-status-max:59px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--k-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--k-w);height:var(--k-h);
  border-radius:var(--k-r-phone);overflow:hidden;background:var(--k-card);color:var(--k-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:100%;height:var(--k-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--k-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb .rec{position:absolute;left:215px;top:26.8px;width:5.8px;height:5.8px;border-radius:50%;background:var(--k-rec)}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.t,.b,.a,.ic{position:absolute}
.a,.ic{display:block}
.ic{overflow:visible}
.t{white-space:nowrap}
.u{font:var(--k-t-unit)}
.k{color:var(--k-ink)}
s{text-decoration:line-through}</style>
</head>

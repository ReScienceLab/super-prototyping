<style>
:root{

  /* Surface */

  --k-well:#E5E5E5;

  --k-sheet:#F6F6F6;

  --k-illo-grabber:#CCCCCC;
  --k-night:#010101;
  --k-skip:#121212;

  --k-disc:rgba(255,255,255,.17);
  --k-price:#131313;
  --k-plan-lo:#282828;
  --k-plan-hi:#333536;
  --k-free-bg:#341A0E;
  --k-scrim-btn:rgba(0,0,0,.32);

  --k-rec:#F09540;
  --k-page:#FFFFFF;
  --k-chip:#F5F5F5;
  --k-composer:#FEFEFE;
  --k-ctl:#F4F3F4;
  --k-btn:#000000;
  --k-scrim-sheet:rgba(0,0,0,.19);

  --k-store-dim:#BDBFBC;
  --k-store-disc:#FAFAFA;
  --k-store-pill:#EEEEEF;
  --k-card-blue:#80BEFD;
  --k-card-pale:#E8F3FE;

  /* Line */
  --k-material-line:rgba(255,255,255,.16);
  --k-price-line:#252525;
  --k-plan-line:rgba(255,255,255,.17);
  --k-composer-shadow:rgba(0,0,0,.07);

  --k-ink:#000000;
  --k-ink-inv:#FFFFFF;
  --k-mute:#A9A9A9;
  --k-skip-ink:#BBBBBB;
  --k-foot:#838383;

  --k-dots:#C5C5C5;
  --k-copy-mute:#7F7F7F;
  --k-placeholder:#7E7E7E;
  --k-sheet-copy:#5B5B5B;
  --k-store-mute:#8A8A8D;
  --k-store-val:#8E8E92;
  --k-store-label:#B1B1B4;
  --k-store-link:#0088FF;
  --k-store-pill-ink:#CFCFD1;
  --k-illo-label:#333333;
  --k-illo-sub:#5A5A5A;

  /* Radius */
  --k-r-phone:52px;
  --k-r-widget:27px;
  --k-r-card:26px;
  --k-r-sheet:30px;

  --k-r-store:38px;
  --k-r-card:18px;
  --k-r-tip:14px;
  --k-r-pill:999px;

  /* Type */
  --k-t-time:600 15px/20px var(--k-font);
  --k-t-widget:600 19.5px/24px var(--k-font);
  --k-t-h:600 17px/22px var(--k-font);

  --k-t-title:600 21px/26px var(--k-font);
  --k-t-copy:400 14px/19px var(--k-font);
  --k-t-link:400 16.75px/22px var(--k-font);
  --k-t-btn:600 15.5px/20px var(--k-font);
  --k-t-hdr:600 22px/28px var(--k-font);
  --k-t-chip:500 14px/20px var(--k-font);
  --k-t-ask:400 16px/21px var(--k-font);

  --k-t-store-h:700 21px/26px var(--k-font);

  --k-t-store-sub:400 14px/19px var(--k-font);

  --k-t-store-val:700 21px/25px var(--k-font);
  --k-t-store-small:400 11.5px/14px var(--k-font);

  --k-h-pro:874px;

  /* Font */

  /* Surface */

  --k-nav-well:#C8C8C9;
  --k-avatar:#F0F0F0;
  --k-toggle-off:#C5C4C7;

  --k-card-line:#EAEAEA;

  /* Ink */
  --k-voice-sub:#5E5E5E;
  --k-dot-off:#A6A3A7;
  --k-voice-btn:#090709;
  --k-section-ink:#787878;
  --k-sec-ink:#7C7C7C;
  --k-danger:#BE484C;
  --k-version-ink:#C2C2C2;

  /* Radius */
  --k-r-voice:37.5px;
  --k-r-modal:39.5px;
  --k-r-group:25.5px;

  /* Type */
  --k-t-nav:500 16px/22px var(--k-font);
  --k-t-voice:600 16.25px/21px var(--k-font);
  --k-t-mail:400 15.9px/20px var(--k-font);
  --k-t-section:600 15px/20px var(--k-font);
  --k-t-voice-sub:400 16px/21px var(--k-font);
  --k-t-hint:400 14.25px/18px var(--k-font);

  /* Metrics */
  --k-row-s:52px;
  --k-sheet-blur:19px;
  --k-sheet-top-s:58.7px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--k-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--k-w);height:var(--k-h);
  border-radius:var(--k-r-phone);overflow:hidden;background:var(--k-card);color:var(--k-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:100%;height:var(--k-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--k-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb .rec{position:absolute;left:215px;top:26.8px;width:5.8px;height:5.8px;border-radius:50%;background:var(--k-rec)}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.t,.b,.a,.ic{position:absolute}
.a,.ic{display:block}
.ic{overflow:visible}
.t{white-space:nowrap}
.u{font:var(--k-t-unit)}
.k{color:var(--k-ink)}
s{text-decoration:line-through}</style>

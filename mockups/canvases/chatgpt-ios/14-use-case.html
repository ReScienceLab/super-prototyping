<!DOCTYPE html>

<head>

<title>ChatGPT iOS - Use case</title>
<style>
:root{
  /* Font */
  --g-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;

  /* Surface */
  --g-bg:#FFFFFF;
  --g-card:#FAFAFA;
  --g-chip:#F7F7F7;
  --g-sheet:#EFECF0;
  --g-dark:#030003;
  --g-dark-2:#2F2C2F;
  --g-fab:#242424;
  --g-web-btn:#0D0D0D;
  --g-disabled:#A1A0A3;
  --g-close:#C5C5C7;
  --g-fade:#F3F3F3;
  --g-scrim:rgba(20,5,20,.20);

  /* Line */
  --g-field:#DFDFDF;
  --g-pill:#E0E0E0;
  --g-hair:#E8E8E8;

  /* Ink */
  --g-ink:#000000;
  --g-ink-web:#0D0D0D;
  --g-sub:#5F5F5F;
  --g-sub-web:#676767;
  --g-mute:#868686;
  --g-place:#909090;
  --g-tab:#8B8B8C;
  --g-legal:#8A8A8A;

  /* Accent */
  --g-blue:#5953B8;

  /* Radius */
  --g-r-phone:52px;
  --g-r-field:12px;
  --g-r-card:16px;
  --g-r-sheet:48.5px;
  --g-r-pill:999px;

  /* Type */
  --g-t-time:600 15px/20px var(--g-font);
  --g-t-h1:600 34px/40px var(--g-font);
  --g-t-wall:600 33px/40px var(--g-font);
  --g-t-h2:500 28px/33px var(--g-font);
  --g-t-h3:500 22px/28px var(--g-font);
  --g-t-side:600 22px/28px var(--g-font);
  --g-t-body:400 17px/22px var(--g-font);
  --g-t-row:400 17px/22px var(--g-font);
  --g-t-btn:600 17px/22px var(--g-font);
  --g-t-emph:500 17px/22px var(--g-font);
  --g-t-nav:600 17px/22px var(--g-font);
  --g-t-card:600 15px/20px var(--g-font);
  --g-t-cards:400 15px/20px var(--g-font);
  --g-t-web:400 16px/21px var(--g-font);
  --g-t-webbtn:600 17.6px/22px var(--g-font);
  --g-t-webcta:500 17px/22px var(--g-font);
  --g-t-webact:500 16px/22px var(--g-font);
  --g-t-sheeth:600 26.75px/32.5px var(--g-font);
  --g-t-sheet:400 15.25px/20.5px var(--g-font);
  --g-t-sheetbtn:600 16px/21px var(--g-font);
  --g-t-weblegal:400 12.8px/17px var(--g-font);
  --g-t-webh:400 22px/28px var(--g-font);
  --g-t-proj:400 28px/34px var(--g-font);
  --g-t-tab:600 15px/20px var(--g-font);
  --g-t-lbl:400 12px/16px var(--g-font);

  /* Metrics */
  --g-w:393px;
  --g-h:852px;
  --g-status:54px;
  --g-gutter:24px;
  --g-content:345px;
  --g-sheet-top:59px;
  --g-field-h:54.8px;
  --g-btn-web:53.8px;
  --g-btn-h:47.5px;
  --g-row:48px;
  --g-comp-h:47.2px;
  --g-comp-x:30.5px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--g-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--g-w);height:var(--g-h);
  border-radius:var(--g-r-phone);overflow:hidden;background:var(--g-bg);color:var(--g-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--g-w);height:var(--g-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--g-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.t,.b,.i,.a{position:absolute}
.i{display:block;fill:none}
.a{display:block;object-fit:cover}
.t{white-space:nowrap}
.w{white-space:normal}
u{text-underline-offset:2px}</style>
</head>

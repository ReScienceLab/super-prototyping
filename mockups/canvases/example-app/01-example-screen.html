<!doctype html>
<meta charset="utf-8">
<title>Example App — Home</title>
<style>
/* Token block — byte-identical copy of 00-design-tokens.html. */
:root{
  --x-font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
  --x-mono:ui-monospace,SFMono-Regular,Menlo,monospace;

  --x-bg:#FFFFFF;      --x-bg-alt:#F7F6F4;   --x-fill:#F1EFEC;
  --x-hairline:#E9E8E7; --x-border:#EFEEEC;
  --x-text:#23221F;    --x-text-2:#6F6D69;   --x-text-3:#9B9A97;
  --x-accent:#2784E0;  --x-danger:#E0574A;

  --x-r-field:10px; --x-r-card:12px; --x-r-sheet:14px; --x-r-tile:8px; --x-r-pill:999px;

  --x-t-title:600 22px/28px var(--x-font);
  --x-t-row:400 17px/22px var(--x-font);
  --x-t-body:400 15px/20px var(--x-font);
  --x-t-caption:400 13px/17px var(--x-font);

  --x-gutter:20px; --x-row-h:44px; --x-tap:44px; --x-status-h:54px; --x-sheet-top:71px;
}

/* Artboard shell — 478 x 980 shape box, phone centred inside it. */
html,body{margin:0;height:100%}
body{width:478px;height:980px;box-sizing:border-box;background:#ECEDF3;
     display:flex;align-items:center;justify-content:center;font:var(--x-t-body)}

/* iPhone frame: 393 x 852pt at 1pt = 1px. */
.phone{position:relative;width:393px;height:852px;overflow:hidden;
       background:var(--x-bg);color:var(--x-text);border-radius:44px;
       box-shadow:0 1px 3px rgba(0,0,0,.10),0 12px 32px rgba(0,0,0,.12)}

.sb{height:var(--x-status-h);display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 28px 8px;font:600 15px/20px var(--x-font)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
        width:125px;height:36px;border-radius:18px;background:#000}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
      width:139px;height:5px;border-radius:3px;background:#000;opacity:.85}

.nav{display:flex;align-items:center;justify-content:space-between;
     height:var(--x-row-h);padding:0 var(--x-gutter)}
.nav h1{margin:0;font:var(--x-t-title)}
.nav button{all:unset;width:var(--x-tap);height:var(--x-tap);margin-right:-10px;
            display:flex;align-items:center;justify-content:center;color:var(--x-accent)}

.search{margin:6px var(--x-gutter) 14px;height:36px;border-radius:var(--x-r-field);
        background:var(--x-fill);display:flex;align-items:center;gap:7px;padding:0 10px;
        font:var(--x-t-body);color:var(--x-text-3)}

.card{margin:0 var(--x-gutter);border:1px solid var(--x-border);
      border-radius:var(--x-r-card);overflow:hidden;background:var(--x-bg)}
.row{display:flex;align-items:center;gap:12px;min-height:var(--x-row-h);
     padding:9px 14px;font:var(--x-t-row)}
.row+.row{border-top:1px solid var(--x-hairline)}
.row .dot{width:26px;height:26px;border-radius:var(--x-r-tile);background:var(--x-fill);
          flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.row .meta{margin-left:auto;font:var(--x-t-caption);color:var(--x-text-3)}

h2.sec{margin:22px var(--x-gutter) 8px;font:600 12px/16px var(--x-font);
       letter-spacing:.06em;text-transform:uppercase;color:var(--x-text-3)}
p.note{margin:14px var(--x-gutter) 0;font:var(--x-t-caption);color:var(--x-text-2)}

.tabs{position:absolute;left:0;right:0;bottom:0;height:83px;
      border-top:1px solid var(--x-hairline);background:rgba(255,255,255,.94);
      display:flex;align-items:flex-start;padding-top:9px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
     font:400 10px/13px var(--x-font);color:var(--x-text-3)}
.tab.on{color:var(--x-accent)}
</style>

<div class="phone">
  <div class="island"></div>
  <div class="sb"><span>9:41</span>
    <svg width="66" height="12" viewBox="0 0 66 12" fill="currentColor" aria-hidden="true">
      <rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/>
      <rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/>
      <path d="M25.5 4.2a7.4 7.4 0 0 1 9 0l-1.5 1.6a5.2 5.2 0 0 0-6 0zM28 7.3a3.6 3.6 0 0 1 4 0L30 9.6z"/>
      <rect x="44" y="2" width="18" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".4"/>
      <rect x="45.5" y="3.5" width="13" height="6" rx="1.5"/><rect x="63" y="5" width="1.6" height="3" rx=".8" opacity=".4"/>
    </svg></div>

  <div class="nav">
    <h1>Home</h1>
    <button aria-label="New item">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <path d="M11 4v14M4 11h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="search">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
      <circle cx="6.5" cy="6.5" r="4.75" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10.2 10.2 13.2 13.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Search
  </div>

  <h2 class="sec">Recent</h2>
  <div class="card">
    <div class="row"><span class="dot">◆</span>First item<span class="meta">2m</span></div>
    <div class="row"><span class="dot">◇</span>Second item<span class="meta">1h</span></div>
    <div class="row"><span class="dot">○</span>Third item<span class="meta">Yesterday</span></div>
  </div>

  <p class="note">Template screen. Every colour, radius, inset and type size above comes
  from the token block — nothing is hard-coded here.</p>

  <div class="tabs">
    <div class="tab on"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M3.5 9.5 11 3.5l7.5 6V18a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Home</div>
    <div class="tab"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M9.8 3.5a6.3 6.3 0 1 1 0 12.6 6.3 6.3 0 0 1 0-12.6M14.4 14.4 18.5 18.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Search</div>
    <div class="tab"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M4.5 4.5h5v13h-5zM12.5 4.5h5v13h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Library</div>
    <div class="tab"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M11 3.5a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 0 1 0-7.2M4 18.5a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Me</div>
  </div>
  <div class="home"></div>
</div>

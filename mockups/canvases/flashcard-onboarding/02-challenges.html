<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcard Onboarding - Challenges</title>
<style>
:root{
  /* Font */
  --f-font:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --f-tracking:-.025em;

  /* Surface */
  --f-bg:#FFFFFF;
  --f-card:#FDFAF4;
  --f-track:#F4F4F4;
  --f-pill-off:#C1C1C1;

  /* Line */
  --f-hairline:#EFEFEF;

  /* Ink */
  --f-ink:#000000;
  --f-ink-mid:#3A3A3A;
  --f-ink-2:#7E7E7E;
  --f-ink-inv:#FFFFFF;

  /* Accent */
  --f-accent:#F39D05;

  /* Fill */
  --f-pill-dark:linear-gradient(180deg,#8A8A8A 0,#3C3C3C 6.8px,#141414 15.7px,#0F0F0F 30px,#090909 41px,#040404 100%);
  --f-pill-grey:linear-gradient(180deg,#DADADA 0,#D2D2D2 4.5px,#C4C4C4 9.8px,#C1C1C1 30px,#C1C1C1 100%);
  --f-btn-dark:linear-gradient(180deg,#8A8A8A 0,#3C3C3C 5px,#000000 12px,#000000 100%);

  /* Radius */
  --f-r-pill:999px;
  --f-r-phone:52px;

  /* Type */
  --f-t-eyebrow:600 15px/18px var(--f-font);
  --f-t-title:700 36px/42.3px var(--f-font);
  --f-t-sub:400 15px/18.7px var(--f-font);
  --f-t-btn:600 20px/24px var(--f-font);
  --f-t-legal:400 13px/17.2px var(--f-font);
  --f-t-time:590 17px/22px var(--f-font);

  /* Metrics */
  --f-w:393px;
  --f-h:852px;
  --f-status:54px;
  --f-nav-y:768.7px;
  --f-nav-h:56.8px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--f-w);height:var(--f-h);
  border-radius:var(--f-r-phone);overflow:hidden;background:var(--f-bg);color:var(--f-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--f-w);height:var(--f-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;
  font:var(--f-t-time)}
.sb svg{position:absolute;display:block;fill:currentColor}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
img.a{position:absolute;display:block}
.c{position:absolute;left:0;width:var(--f-w);text-align:center;
  letter-spacing:var(--f-tracking)}
.eyebrow{font:var(--f-t-eyebrow)}
.title{font:var(--f-t-title)}
.sub{font:var(--f-t-sub);color:var(--f-ink-2)}

.track{position:absolute;left:12.7px;top:769.5px;width:365.8px;height:55.3px;
  border-radius:var(--f-r-pill);background:var(--f-track)}
.pill{position:absolute;top:var(--f-nav-y);height:var(--f-nav-h);
  border-radius:var(--f-r-pill);color:var(--f-ink-inv)}
.pill.back{left:12.7px;width:84.5px;background:var(--f-pill-grey)}
.pill.back.on{background:var(--f-pill-dark)}
.pill.next{left:295.5px;width:83px;background:var(--f-pill-dark)}
.pill svg{position:absolute;left:50%;top:21.9px;margin-left:-9.35px;
  display:block;width:18.7px;height:14.2px}

.btn{position:absolute;left:12.7px;width:352.8px;border-radius:var(--f-r-pill)}
.btn1{top:560.5px;height:56.1px;background:var(--f-btn-dark)}
.btn2{top:623.1px;height:56.1px;background:var(--f-bg);
  border:1.5px solid var(--f-hairline)}
.lbl{position:absolute;left:12.7px;width:352.8px;text-align:center;
  letter-spacing:var(--f-tracking);
  font:var(--f-t-btn)}
.legal{font:var(--f-t-legal);color:var(--f-ink-2)}
.legal b{font-weight:600;color:var(--f-ink)}</style>
</head>

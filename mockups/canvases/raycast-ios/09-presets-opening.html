<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raycast iOS — Presets opening</title>
<style>
/* ============================================================================
   RAYCAST iOS — ASK AI.  Tokens below are byte-identical in every artboard of
   this folder (the canvas renders each one in <iframe srcDoc sandbox="">, so
   there is no shared stylesheet). Edit gen_raycast.py, never these files.
   Sampled from 393 x 852 pt @3x captures.
   ========================================================================= */
:root{
  --rc-font:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --rc-bg:#FFFFFF;        /* note page + sheet ground                     */
  --rc-scrim:rgba(0,0,0,.20); /* modal dim over the note                  */
  --rc-fill:#F6F6F6;      /* chip pill, mic button                        */
  --rc-fill-2:#F3F3F3;    /* sheet close button                           */
  --rc-fill-3:#F1F1F1;    /* compose-sheet back button                    */
  --rc-border:#E4E4E4;    /* Copy button 1pt outline                      */
  --rc-kb:#E3E5E6;        /* keyboard ground                              */
  --rc-key:#FFFFFF;       /* keycap                                       */
  --rc-home:#EFEFEF;      /* home / launcher ground                       */
  --rc-card:#F7F7F7;      /* composer card, Customize pill                */
  --rc-field:#FCFBFC;     /* search pill, filter + avatar wells           */
  --rc-sheet:#F5F5F5;     /* Models sheet ground                          */
  --rc-hdr-btn:#EEEEEE;   /* Models sheet header circles                  */
  --rc-row-sel:#EBEBEB;   /* selected row, Models sheet                   */
  --rc-row-sel-2:rgba(0,0,0,.018); /* selected row over the Presets blur   */
  --rc-glass:rgba(255,255,255,.82); /* Edit pill, dismiss button          */
  --rc-add:#F1F6FF;       /* Presets "+" well                             */
  --rc-veil:rgba(255,255,255,.22);  /* white veil over the Presets blur   */

  /* Ink */
  --rc-ink:#0A0A0A;       /* titles, body copy, mic + send + Apply fill   */
  --rc-ink-2:#4B4B4B;     /* Copy label                                   */
  --rc-ink-3:#474747;     /* chip dismiss circle                          */
  --rc-ink-4:#9B9B9B;     /* composer placeholder                         */
  --rc-ink-dis:#A5A5A5;   /* undo / redo, disabled                        */
  --rc-glyph:#262626;     /* toolbar chevron + overflow dots              */
  --rc-glyph-2:#3F3F3F;   /* sheet close X                                */
  --rc-caret:#1E88FF;     /* text caret                                   */
  --rc-onblack:#FFFFFF;   /* Apply label, send arrow                      */
  --rc-ink-5:#4D4D4D;     /* composer model name (Ray-1 / Sonar…)         */
  --rc-ink-6:#484848;     /* empty-state copy                             */
  --rc-ink-7:#909090;     /* "Favorites" section header                   */
  --rc-ink-8:#BABABA;     /* "Search Raycast" placeholder                 */
  --rc-beta:#C9A445;      /* Beta pill stroke + ink                       */
  --rc-brand:#FF6363;     /* Raycast coral                                */

  /* Radius */
  --rc-r-sheet:38px; --rc-r-key:5px; --rc-r-kb:18px;
  --rc-r-thumb:2.5px; --rc-r-pill:999px;
  --rc-r-card:26px;       /* composer card                                */
  --rc-r-tile:12px;       /* launcher app tile                            */
  --rc-r-row:16px;        /* list-row highlight                           */
  --rc-r-btn:16px;        /* composer dictation button                    */

  /* Type */
  --rc-t-title:700 27px/33px var(--rc-font);  /* note title              */
  --rc-t-h1:700 27px/40px var(--rc-font);     /* answer title in sheet   */
  --rc-t-body:400 17px/21px var(--rc-font);   /* note body               */
  --rc-t-prose:400 17px/24px var(--rc-font);  /* answer body in sheet    */
  --rc-t-hdr:400 17px/22px var(--rc-font);    /* sheet header + composer */
  --rc-t-btn:500 17px/20px var(--rc-font);    /* Copy / Apply            */
  --rc-t-chip:400 15px/18px var(--rc-font);   /* Full Note chip          */
  --rc-t-time:600 17px/1 var(--rc-font);      /* status bar clock        */
  --rc-t-key:400 24px/1 var(--rc-font);       /* keycap letter           */
  --rc-t-key-s:400 18px/1 var(--rc-font);     /* keycap "123"            */
  --rc-t-sheet:700 22px/28px var(--rc-font);  /* "Models"                */
  --rc-t-nav:600 17px/22px var(--rc-font);    /* "Presets" nav title     */
  --rc-t-tile:400 12px/17px var(--rc-font);   /* tile caption, Favorites */
  --rc-t-beta:500 11px/14px var(--rc-font);   /* Beta pill               */

  /* Metrics */
  --rc-gutter:24px;       /* note page gutter                            */
  --rc-sheet-pad:20px;    /* sheet content gutter                        */
  --rc-sheet-hpad:16px;   /* sheet header + footer gutter                */
  --rc-tap:44px;          /* toolbar button                              */
  --rc-sb:54px;           /* status bar                                  */
  --rc-sheet-top:402px;   /* answer sheet top inset                      */
  --rc-sheet-top-2:90px;  /* compose sheet top inset                     */
  --rc-kb-top:554px;      /* keyboard top                                */
  --rc-sheet-top-3:397px; /* Models sheet top edge (inset 3, bottom 849)  */
  --rc-row:64px;          /* Presets row pitch                           */
  --rc-row-2:51px;        /* Models sheet row pitch                      */
  --rc-tile:45px;         /* launcher app tile                           */
  --rc-hdr:44px;          /* home header well / nav button height        */
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--rc-font);background:#fff;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{width:393px;height:852px;position:relative;border-radius:52px;overflow:hidden;flex:none;
  background:var(--rc-bg);transform:translateZ(0);outline:1px solid rgba(0,0,0,.10);
  box-shadow:0 0 0 11px #1D191A, 0 0 0 12.5px #3A3735, 0 24px 60px rgba(29,25,26,.28);
  color:var(--rc-ink)}
.statusbar{position:absolute;left:0;right:0;top:0;height:var(--rc-sb);z-index:1;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 33px 15px 55px}
.statusbar .time{font:var(--rc-t-time);letter-spacing:.2px;margin-bottom:1.7px}
.sicons{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sicons svg{display:block}
.scrim{position:absolute;inset:0;background:var(--rc-scrim);z-index:2}
.sheet{position:absolute;background:var(--rc-bg);z-index:3;overflow:hidden}

/* --- launcher / composer, shared by 07-11 ------------------------------- */
.home{position:absolute;inset:0;background:var(--rc-home)}
.hdr{position:absolute;left:16px;right:16px;top:59px;height:var(--rc-hdr);display:flex;gap:12px}
.well{background:var(--rc-field);border-radius:var(--rc-r-pill);height:var(--rc-hdr);flex:none}
.well.filter{width:44px;display:flex;align-items:center;justify-content:center}
.well.search{flex:1;display:flex;align-items:center;gap:8px;padding:0 14px;
  font:var(--rc-t-hdr);color:var(--rc-ink-8)}
.avatar{width:44.3px;height:44.3px;border-radius:var(--rc-r-pill);flex:none;
  background:linear-gradient(160deg,#8BA6DF,#7294D8);color:#fff;
  font:600 15px/44.3px var(--rc-font);text-align:center;letter-spacing:.2px}
.tiles{position:absolute;left:0;right:0;top:140px;display:flex;padding:0 4px}
.tiles > div{width:96.25px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tiles svg{display:block;width:var(--rc-tile);height:var(--rc-tile);border-radius:var(--rc-r-tile)}
.tiles span{font:var(--rc-t-tile);color:#050505}
.sect{position:absolute;left:21px;top:247px;font:var(--rc-t-tile);color:var(--rc-ink-7)}
.favs{position:absolute;left:0;right:0;top:291px;filter:blur(3.4px)}
.favs .r{display:flex;gap:10px;padding:0 16px;margin-bottom:22.7px;overflow:hidden;height:26px}
.favs .c{height:26px;border-radius:9px;background:#DEDEDE;display:flex;align-items:center;flex:none;
  gap:7px;padding:0 11px;font:400 15px/26px var(--rc-font);color:#9A9A9A;white-space:nowrap}
.favs .c i{width:15px;height:15px;border-radius:4px;background:#C6C6C6;flex:none}
.empty{position:absolute;left:0;right:0;top:389px;text-align:center;
  font:400 17px/22px var(--rc-font);color:var(--rc-ink-6)}
.cust{position:absolute;left:137px;top:450px;width:119px;height:33px;border-radius:var(--rc-r-pill);
  background:var(--rc-card);display:flex;align-items:center;justify-content:center;gap:7px;
  font:400 15px/18px var(--rc-font);color:#080808}
.comp{position:absolute;left:12px;top:693px;width:369px;height:116px;border-radius:var(--rc-r-card);
  background:var(--rc-card);box-shadow:inset 0 0 0 1px #FDFDFD,0 1px 2px rgba(0,0,0,.05),
  0 10px 30px rgba(0,0,0,.09)}
.chip2{position:absolute;left:7.8px;top:7px;height:33px;display:flex;align-items:center;gap:10.3px;
  padding:0 10.7px 0 9.2px;border-radius:var(--rc-r-pill);background:rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);font:400 15px/18px var(--rc-font);color:#030104}
.chip2 svg{display:block;width:18px;height:18px}
.model{position:absolute;right:17.3px;top:8px;height:33px;display:flex;align-items:center;
  gap:10.6px;font:400 15px/18px var(--rc-font);color:var(--rc-ink-5)}
.clip{position:absolute;left:22.3px;top:74.3px;color:#070707}
.ph{position:absolute;left:60.7px;top:74px;font:var(--rc-t-hdr);color:var(--rc-ink-4)}
.dictate{position:absolute;left:281px;top:60px;width:79px;height:48px;border-radius:var(--rc-r-btn);
  background:#F1F1F1;display:flex;align-items:center;justify-content:center;color:#444144}

/* --- Presets overlay ---------------------------------------------------- */
.blur{position:absolute;inset:0;overflow:hidden;background:var(--rc-home)}
.blur .home{filter:blur(26px)}
.veil{position:absolute;inset:0;background:var(--rc-veil)}
.veil2{position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(
  rgba(255,255,255,.62) 0 60px,rgba(255,255,255,.30) 98px,rgba(255,255,255,0) 134px)}
.nav{position:absolute;left:16px;right:16px;top:59px;height:var(--rc-hdr);
  display:flex;align-items:center;justify-content:space-between}
.nav .glass{background:var(--rc-glass);border-radius:var(--rc-r-pill);height:var(--rc-hdr);
  display:flex;align-items:center;justify-content:center;font:var(--rc-t-hdr);color:#131114}
.nav .edit{width:53px}
.nav .add{width:43.6px;background:var(--rc-add)}
.nav .ttl{position:absolute;left:0;right:0;text-align:center;font:var(--rc-t-nav);color:#0F0C0F}
.list{position:absolute;left:0;right:0;
  -webkit-mask-image:linear-gradient(#000 0 748px,rgba(0,0,0,.55) 782px,rgba(0,0,0,.25) 820px);
  mask-image:linear-gradient(#000 0 748px,rgba(0,0,0,.55) 782px,rgba(0,0,0,.25) 820px)}
.prow.dim{filter:blur(4.6px)}
.prow{position:relative;height:var(--rc-row);display:flex;align-items:center}
.prow .sel{position:absolute;left:16px;right:16px;top:4px;height:56px;
  border-radius:var(--rc-r-row);background:var(--rc-row-sel-2)}
.prow svg.mk{position:relative;width:20.5px;height:20.5px;margin-left:33.7px;display:block}
.prow b{position:relative;margin-left:23.3px;font:var(--rc-t-hdr);color:#151515;font-weight:400}
.prow .ck{position:relative;margin-left:auto;margin-right:29.5px;width:17.5px;height:17.5px;
  border-radius:var(--rc-r-pill);background:#0C0C0C;display:flex;align-items:center;
  justify-content:center}
.dismiss{position:absolute;left:173px;top:770px;width:48px;height:48px;
  border-radius:var(--rc-r-pill);background:var(--rc-glass);display:flex;align-items:center;
  justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.well.filter{color:#111}
.well.search svg{color:#B5B5B5;flex:none}
.cust svg{width:15px;height:11px;color:#101010}
.tiles svg{border-radius:12px}
.nav .glass svg{display:block}
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SnapAction - Resource detail</title>
<style>
:root{
  /* Font */
  --sa-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --sa-bg:#000000;
  --sa-card:#191919;
  --sa-card-sel:#1E2230;
  --sa-chip:#232323;
  --sa-blue-bg:#1E2A47;
  --sa-green-bg:#173626;
  --sa-art-bg:#1E2F24;
  --sa-amber-bg:#3C2A18;
  --sa-detail:#1C1C1E;
  --sa-bar:rgba(26,26,26,0.70);
  --sa-white:#FFFFFF;

  /* Line */
  --sa-line:#2A2A2A;
  --sa-line-2:#4E4E4E;
  --sa-line-4:#343434;
  --sa-hair:#323235;
  --sa-hair-2:#3D3D41;
  --sa-scroll:#7F7F7F;

  /* Ink */
  --sa-ink:#F7F6F2;
  --sa-ink-2:#DEDCD6;
  --sa-ink-3:#A9A6A0;
  --sa-ink-4:#8A8781;
  --sa-ink-5:#8E8E93;
  --sa-ink-btn:#F3F3F3;

  /* Accent */
  --sa-blue:#6E92FF;
  --sa-blue-2:#4A74FF;
  --sa-green:#5BD68A;
  --sa-green-2:#8FDCA8;
  --sa-amber:#F0A468;
  --sa-red:#FF7A6E;

  /* Radius */
  --sa-r-card:18px;
  --sa-r-pill:999px;
  --sa-r-phone:55px;
  --sa-r-phone-xl:62px;

  /* Type */
  --sa-t-time:590 18px/18px var(--sa-font);
  --sa-t-nav:600 17px/22px var(--sa-font);
  --sa-t-btn:600 16px/20px var(--sa-font);
  --sa-t-nav-2:400 17px/22px var(--sa-font);
  --sa-t-day:700 20px/24px var(--sa-font);
  --sa-t-day-2:400 20px/24px var(--sa-font);
  --sa-t-date:600 14px/18px var(--sa-font);
  --sa-t-title:600 14.95px/20px var(--sa-font);
  --sa-t-big:700 21.5px/26px var(--sa-font);
  --sa-t-pill:600 12px/16px var(--sa-font);
  --sa-t-meta:400 12.65px/17px var(--sa-font);
  --sa-t-sub:400 12px/16px var(--sa-font);
  --sa-t-chip:400 11.3px/15px var(--sa-font);
  --sa-t-tag:400 12.2px/16px var(--sa-font);
  --sa-t-tag-2:500 12.2px/16px var(--sa-font);
  --sa-t-tab:600 10.6px/13px var(--sa-font);
  --sa-t-body:400 13px/18.7px var(--sa-font);
  --sa-t-code:600 13px/17px var(--sa-font);
  --sa-t-code-2:600 12px/16px var(--sa-font);
  --sa-t-place:400 12.5px/15.4px var(--sa-font);
  --sa-t-p5:700 16.8px/22px var(--sa-font);
  --sa-t-p5-row:500 15.05px/20px var(--sa-font);

  /* Metrics */
  --sa-w:430px;
  --sa-h:932px;
  --sa-w-xl:440px;
  --sa-h-xl:956px;
  --sa-gutter:18px;
  --sa-pill:20.3px;
  --sa-tile:24px;
  --sa-cal:15px;

  /* 06 light */
  --sa-l-bg:#FFFFFF;
  --sa-l-panel:#F7F7F9;
  --sa-l-line:#E5E7EB;
  --sa-l-ink:#111827;
  --sa-l-ink-2:#374151;
  --sa-l-ink-3:#6B7280;
  --sa-l-ink-4:#9CA3AF;
  --sa-l-blue:#007AFF;
  --sa-l-cta:#1791FF;
  --sa-l-link:#007BFE;
  --sa-l-badge:#8CDEA5;
  --sa-l-badge-ink:#0D401A;
  --sa-t-l-title:700 14px/20px var(--sa-font);
  --sa-t-l-link:400 12px/16px var(--sa-font);
  --sa-t-l-desc:400 12px/18px var(--sa-font);
  --sa-t-l-row:400 13.2px/18px var(--sa-font);
  --sa-t-l-cta:600 15.9px/20px var(--sa-font);
  --sa-t-l-menu:400 18px/18px var(--sa-font);
  --sa-t-i-badge:600 9px/11px var(--sa-font);
  --sa-t-i-line:500 12px/14px var(--sa-font);
  --sa-t-i-cta:500 14px/17px var(--sa-font);
  --sa-r-thumb:24px;
  --sa-r-panel:10px;
  --sa-r-island:42px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sa-font);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;width:478px;height:980px}
.phone{position:relative;flex:none;width:var(--sa-w);height:var(--sa-h);
  border-radius:var(--sa-r-phone);overflow:hidden;background:var(--sa-bg);color:var(--sa-ink);
  box-shadow:0 0 0 10.5px #1D191A,0 0 0 12px #3A3735;transform:scale(1.02575)}
.phone.xl{width:var(--sa-w-xl);height:var(--sa-h-xl);border-radius:var(--sa-r-phone-xl);
  transform:none}
.phone>*{position:absolute}
img.a{display:block;z-index:2}
img.a.rd{border-radius:50%}
.t{white-space:nowrap;z-index:3}
.card{background:var(--sa-card);border:1px solid var(--sa-line);border-radius:var(--sa-r-card)}
.card.sel{background:var(--sa-card-sel);border:2px solid var(--sa-blue-2)}
.sh{z-index:1}
.pill{border-radius:var(--sa-r-pill)}
.fab{background:var(--sa-white);border-radius:50%;z-index:5}
</style>
</head>

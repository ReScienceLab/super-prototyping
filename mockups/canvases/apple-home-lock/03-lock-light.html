<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apple Home & Lock Screen - Lock light</title>
<style>
:root{
  /* Font */
  --hs-font:"SF Pro",-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
  --hs-font-round:"SF Pro Rounded",ui-rounded,-apple-system,sans-serif;

  /* Surface */
  --hs-widget:#FFFFFF;
  --hs-widget-dark:#1C1C1E;
  --hs-glass:rgba(255,255,255,.3);
  --hs-glass-dark:rgba(0,0,0,.3);
  --hs-island:#000000;
  --hs-event-bg:rgba(27,173,248,.2);
  --hs-event-bg-dark:#1C445B;
  --hs-lock-btn:rgba(0,0,0,.26);
  --hs-dragbar:rgba(127,127,127,.5);

  /* Line */
  --hs-grey3:#C7C7CC;
  --hs-grey3-dark:#464649;
  --hs-event-bar:#1BADF8;

  /* Ink */
  --hs-ink:#000000;
  --hs-ink-dark:#FFFFFF;
  --hs-white:#FFFFFF;
  --hs-lock-ink:rgba(255,255,255,.8);
  --hs-blue:#007BFE;
  --hs-blue-dark:#0385FF;
  --hs-red:#FF382B;
  --hs-red-dark:#FE4336;
  --hs-event-title:#106895;
  --hs-event-time:#168AC6;
  --hs-event-ink-dark:#1BADF8;

  /* Radius */
  --hs-r-widget:22px;
  --hs-r-widget-lg:23px;
  --hs-r-app:13px;
  --hs-r-glass:40px;
  --hs-r-event:4px;
  --hs-r-phone:52px;

  /* Type */
  --hs-t-label:400 12px/16px var(--hs-font);
  --hs-t-search:590 12px/16px var(--hs-font);
  --hs-t-time:590 17px/22px var(--hs-font);
  --hs-t-widget-title:590 15px/22px var(--hs-font-round);
  --hs-t-count:590 22px/26px var(--hs-font-round);
  --hs-t-row:400 13px/19px var(--hs-font-round);
  --hs-t-emoji:400 17px/20px var(--hs-font);
  --hs-t-cal-day:590 13px/16px var(--hs-font);
  --hs-t-cal-date:400 34px/41px var(--hs-font);
  --hs-t-event-title:590 15px/20px var(--hs-font);
  --hs-t-event-time:400 14px/19px var(--hs-font);
  --hs-t-lock-date:510 22px/28px var(--hs-font);
  --hs-t-lock-time:590 100px/119px var(--hs-font);

  /* Metrics */
  --hs-w:393px;
  --hs-h:852px;
  --hs-status:54px;
  --hs-top:90px;
  --hs-between:38px;
  --hs-widget-margin:27.5px;
  --hs-app-margin:31px;
  --hs-app:60px;
  --hs-dock-h:98px;
  --hs-dock-margin:12px;
  --hs-dock-pad:22px;
  --hs-search-w:77px;
  --hs-btn:50px;
  --hs-homebar:140px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--hs-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.dark{--hs-widget:var(--hs-widget-dark);--hs-glass:var(--hs-glass-dark);--hs-grey3:var(--hs-grey3-dark);
  --hs-ink:var(--hs-ink-dark);--hs-blue:var(--hs-blue-dark);--hs-red:var(--hs-red-dark);
  --hs-event-bg:var(--hs-event-bg-dark);--hs-event-title:var(--hs-event-ink-dark);--hs-event-time:var(--hs-event-ink-dark)}
.phone{position:relative;flex:none;width:var(--hs-w);height:var(--hs-h);
  border-radius:var(--hs-r-phone);overflow:hidden;background:#000;color:var(--hs-white);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.wp,.a{position:absolute;display:block}
.wp{left:0;top:0;width:var(--hs-w);height:var(--hs-h)}
.sb{position:absolute;left:0;top:0;width:var(--hs-w);height:var(--hs-status);z-index:6}
.sb .time{position:absolute;left:10px;top:18px;width:123.5px;text-align:center;font:var(--hs-t-time);color:var(--hs-white)}
.sb .island{position:absolute;left:133.5px;top:11px;width:126px;height:37px;border-radius:20px;background:var(--hs-island)}
.sb svg{position:absolute;display:block;overflow:visible}
.ldate,.ltime{position:absolute;left:0;width:var(--hs-w);text-align:center;color:var(--hs-lock-ink);white-space:nowrap;
  mix-blend-mode:plus-lighter}
.ldate{top:75px;font:var(--hs-t-lock-date);letter-spacing:-.26px}
.ltime{top:96px;font:var(--hs-t-lock-time);letter-spacing:-1.65px}
.lbtn{position:absolute;top:752px;width:var(--hs-btn);height:var(--hs-btn);border-radius:50%;background:var(--hs-lock-btn)}
.hbar{position:absolute;left:126.5px;top:839px;width:var(--hs-homebar);height:5px;border-radius:100px;
  background:var(--hs-white);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px)}
.drag{position:absolute;left:297px;top:42.5px;width:48px;height:2.33px;border-radius:999px;
  background:var(--hs-dragbar);mix-blend-mode:luminosity}
.drag2{background:#c2c2c2;mix-blend-mode:overlay}</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apple Home & Lock Screen - Home fr</title>
<style>
:root{
  /* Font */
  --hs-font:"SF Pro",-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
  --hs-font-round:"SF Pro Rounded",ui-rounded,-apple-system,sans-serif;

  /* Surface */
  --hs-widget:#FFFFFF;
  --hs-widget-dark:#1C1C1E;
  --hs-glass:rgba(255,255,255,.3);
  --hs-glass-dark:rgba(0,0,0,.3);
  --hs-island:#000000;
  --hs-event-bg:rgba(27,173,248,.2);
  --hs-event-bg-dark:#1C445B;
  --hs-lock-btn:rgba(0,0,0,.26);
  --hs-dragbar:rgba(127,127,127,.5);

  /* Line */
  --hs-grey3:#C7C7CC;
  --hs-grey3-dark:#464649;
  --hs-event-bar:#1BADF8;

  /* Ink */
  --hs-ink:#000000;
  --hs-ink-dark:#FFFFFF;
  --hs-white:#FFFFFF;
  --hs-lock-ink:rgba(255,255,255,.8);
  --hs-blue:#007BFE;
  --hs-blue-dark:#0385FF;
  --hs-red:#FF382B;
  --hs-red-dark:#FE4336;
  --hs-event-title:#106895;
  --hs-event-time:#168AC6;
  --hs-event-ink-dark:#1BADF8;

  /* Radius */
  --hs-r-widget:22px;
  --hs-r-widget-lg:23px;
  --hs-r-app:13px;
  --hs-r-glass:40px;
  --hs-r-event:4px;
  --hs-r-phone:52px;

  /* Type */
  --hs-t-label:400 12px/16px var(--hs-font);
  --hs-t-search:590 12px/16px var(--hs-font);
  --hs-t-time:590 17px/22px var(--hs-font);
  --hs-t-widget-title:590 15px/22px var(--hs-font-round);
  --hs-t-count:590 22px/26px var(--hs-font-round);
  --hs-t-row:400 13px/19px var(--hs-font-round);
  --hs-t-emoji:400 17px/20px var(--hs-font);
  --hs-t-cal-day:590 13px/16px var(--hs-font);
  --hs-t-cal-date:400 34px/41px var(--hs-font);
  --hs-t-event-title:590 15px/20px var(--hs-font);
  --hs-t-event-time:400 14px/19px var(--hs-font);
  --hs-t-lock-date:510 22px/28px var(--hs-font);
  --hs-t-lock-time:590 100px/119px var(--hs-font);

  /* Metrics */
  --hs-w:393px;
  --hs-h:852px;
  --hs-status:54px;
  --hs-top:90px;
  --hs-between:38px;
  --hs-widget-margin:27.5px;
  --hs-app-margin:31px;
  --hs-app:60px;
  --hs-dock-h:98px;
  --hs-dock-margin:12px;
  --hs-dock-pad:22px;
  --hs-search-w:77px;
  --hs-btn:50px;
  --hs-homebar:140px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--hs-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.dark{--hs-widget:var(--hs-widget-dark);--hs-glass:var(--hs-glass-dark);--hs-grey3:var(--hs-grey3-dark);
  --hs-ink:var(--hs-ink-dark);--hs-blue:var(--hs-blue-dark);--hs-red:var(--hs-red-dark);
  --hs-event-bg:var(--hs-event-bg-dark);--hs-event-title:var(--hs-event-ink-dark);--hs-event-time:var(--hs-event-ink-dark)}
.phone{position:relative;flex:none;width:var(--hs-w);height:var(--hs-h);
  border-radius:var(--hs-r-phone);overflow:hidden;background:#000;color:var(--hs-white);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.wp,.a{position:absolute;display:block}
.wp{left:0;top:0;width:var(--hs-w);height:var(--hs-h)}
.sb{position:absolute;left:0;top:0;width:var(--hs-w);height:var(--hs-status);z-index:6}
.sb .time{position:absolute;left:10px;top:18px;width:123.5px;text-align:center;font:var(--hs-t-time);color:var(--hs-white)}
.sb .island{position:absolute;left:133.5px;top:11px;width:126px;height:37px;border-radius:20px;background:var(--hs-island)}
.sb svg{position:absolute;display:block;overflow:visible}
.card{position:absolute;top:var(--hs-top);background:var(--hs-widget);color:var(--hs-ink);overflow:hidden}
.rem{left:var(--hs-widget-margin);width:158px;height:158px;border-radius:var(--hs-r-widget)}
.cal{left:195.5px;width:170px;height:170px;border-radius:var(--hs-r-widget-lg)}
.rem h3{position:absolute;left:16px;top:10px;font:var(--hs-t-widget-title);letter-spacing:.42px;color:var(--hs-blue);white-space:nowrap}
.rem .n{position:absolute;right:17px;top:7px;font:var(--hs-t-count)}
.rem .row{position:absolute;left:48px;display:flex;align-items:flex-start;gap:1px;
  font:var(--hs-t-row);letter-spacing:.5px;white-space:nowrap}
.rem .row em{font:var(--hs-t-emoji);font-style:normal}
.rem .rad{position:absolute;left:15px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--hs-grey3)}
.rem .dv{position:absolute;left:15px;width:126px;height:1px;
  background:repeating-linear-gradient(90deg,var(--hs-grey3) 0 2px,transparent 2px 3px)}
.cal .day{position:absolute;left:16px;top:14px;font:var(--hs-t-cal-day);letter-spacing:-.08px;
  text-transform:uppercase;color:var(--hs-red);white-space:nowrap}
.cal .date{position:absolute;left:16px;top:28px;font:var(--hs-t-cal-date);letter-spacing:.4px}
.cal .ev{position:absolute;left:16px;top:73px;width:138px;display:flex;flex-direction:column;gap:4px}
.cal .e{display:flex;gap:4px}
.cal .bar{flex:none;width:4px;border-radius:100px;background:var(--hs-event-bar)}
.cal .d{flex:1;min-width:0;background:var(--hs-event-bg);border-radius:var(--hs-r-event);padding:0 4px}
.cal .d b{display:block;font:var(--hs-t-event-title);letter-spacing:-.23px;color:var(--hs-event-title);
  margin-bottom:-3px;white-space:nowrap;overflow:hidden}
.cal .d span{display:block;font:var(--hs-t-event-time);letter-spacing:-.15px;color:var(--hs-event-time);white-space:nowrap}
.cal .d span i{font:var(--hs-t-label);font-style:normal}
.wl,.al{position:absolute;text-align:center;font:var(--hs-t-label);color:var(--hs-white);white-space:nowrap}
.al{width:100px;margin-left:-20px}
.app{position:absolute;display:block;width:var(--hs-app);height:var(--hs-app);border-radius:var(--hs-r-app)}
.glass{position:absolute;background:var(--hs-glass);border-radius:var(--hs-r-glass);
  -webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px)}
.search{left:158px;top:690px;width:var(--hs-search-w);height:30px}
.search span{position:absolute;left:24px;top:7px;font:var(--hs-t-search);color:var(--hs-white);white-space:nowrap}
.dock{left:var(--hs-dock-margin);top:742px;width:369px;height:var(--hs-dock-h)}</style>
</head>

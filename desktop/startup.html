<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Super Prototyping</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --fg-dim: #6b6b6b;
    --bg: #ffffff;
    --border: #d8d8d8;
    --hover: #f2f2f2;
    --accent: #2563eb;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #ececec;
      --fg-dim: #9a9a9a;
      --bg: #1e1e1e;
      --border: #3a3a3a;
      --hover: #2a2a2a;
      --accent: #4d8dff;
      --accent-fg: #0b0b0b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--fg-dim); }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  li { border-bottom: 1px solid var(--border); }
  li:last-child { border-bottom: none; }
  label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
  }
  label:hover { background: var(--hover); }
  .icon { width: 18px; height: 18px; font-size: 18px; display: inline-flex; align-items: center; flex: none; }
  .found { margin-left: auto; color: var(--fg-dim); font-size: 12px; text-align: right; }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
</style>
</head>
<body>
  <h1>Agents on this machine</h1>
  <p class="sub">Each checked agent gets the super-prototyping skills copied into the project you open or create next. Uncheck anything this got wrong.</p>
  <ul id="list"></ul>
  <div class="actions">
    <button id="create" type="button">Create a new project…</button>
    <button id="open" class="primary" type="button">Open a project…</button>
  </div>
  <script>
    var agents = JSON.parse(new URLSearchParams(location.search).get("agents") || "[]");
    // Found ones first: what the machine has is the top of the list, not scattered through it.
    agents.sort(function (a, b) { return (b.found.length > 0) - (a.found.length > 0); });
    var list = document.getElementById("list");
    agents.forEach(function (agent) {
      var li = document.createElement("li");
      var label = document.createElement("label");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.value = agent.id;
      input.checked = agent.found.length > 0;
      label.appendChild(input);
      var icon = document.createElement("span");
      icon.className = "icon";
      icon.innerHTML = agent.icon; // the app's own SVG from icons/, not anything a user typed
      label.appendChild(icon);
      label.appendChild(document.createTextNode(agent.name));
      var found = document.createElement("span");
      found.className = "found";
      found.textContent = agent.found.length ? agent.found.join(" · ") : "not found";
      label.appendChild(found);
      li.appendChild(label);
      list.appendChild(li);
    });
    function choose(action) {
      var checked = list.querySelectorAll("input:checked");
      window.startup.choose(action, Array.prototype.map.call(checked, function (el) { return el.value; }));
    }
    document.getElementById("create").addEventListener("click", function () { choose("create"); });
    document.getElementById("open").addEventListener("click", function () { choose("open"); });
  </script>
</body>
</html>

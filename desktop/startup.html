<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Super Prototyping</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --fg-dim: #6b6b6b;
    --bg: #ffffff;
    --border: #d8d8d8;
    --hover: #f2f2f2;
    --accent: #2563eb;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #ececec;
      --fg-dim: #9a9a9a;
      --bg: #1e1e1e;
      --border: #3a3a3a;
      --hover: #2a2a2a;
      --accent: #4d8dff;
      --accent-fg: #0b0b0b;
    }
  }
  * { box-sizing: border-box; }
  /* The page sits in the canvas's own window, so the content is a centred column with the
     rows two abreast, not a list down a tall narrow one. */
  body {
    margin: 0;
    padding: 40px;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  main { width: 100%; max-width: 880px; max-height: 100%; display: flex; flex-direction: column; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--fg-dim); }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
  }
  li { border: 1px solid var(--border); border-radius: 6px; }
  label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
  }
  label:hover { background: var(--hover); border-radius: 6px; }
  .icon { width: 18px; height: 18px; font-size: 18px; display: inline-flex; align-items: center; flex: none; }
  .found { margin-left: auto; color: var(--fg-dim); font-size: 12px; text-align: right; }
  .name, .tag { white-space: nowrap; }
  .tag { font-size: 11px; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
  li:has(input:checked) { border-color: var(--accent); }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
</style>
</head>
<body>
  <main>
    <h1>Which agent will you work with?</h1>
    <p class="sub">It gets the super-prototyping skills copied into the project you open or create next. Each row says what was found of it on this machine.</p>
    <ul id="list"></ul>
    <div class="actions">
      <button id="create" type="button">Create a new project…</button>
      <button id="open" class="primary" type="button">Open a project…</button>
    </div>
  </main>
  <script>
    var agents = JSON.parse(new URLSearchParams(location.search).get("agents") || "[]");
    // The recommended pair first, then what the machine has, then the rest; the first row with
    // something found starts selected, so the default is a recommended agent whenever one is here.
    agents.sort(function (a, b) {
      return (!!b.recommended - !!a.recommended) || ((b.found.length > 0) - (a.found.length > 0));
    });
    var initial = agents.find(function (a) { return a.found.length > 0; }) || agents[0];
    var list = document.getElementById("list");
    agents.forEach(function (agent) {
      var li = document.createElement("li");
      var label = document.createElement("label");
      var input = document.createElement("input");
      input.type = "radio";
      input.name = "agent";
      input.value = agent.id;
      input.checked = agent === initial;
      label.appendChild(input);
      var icon = document.createElement("span");
      icon.className = "icon";
      icon.innerHTML = agent.icon; // the app's own SVG from icons/, not anything a user typed
      label.appendChild(icon);
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = agent.name;
      label.appendChild(name);
      if (agent.recommended) {
        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "Recommended";
        label.appendChild(tag);
      }
      var found = document.createElement("span");
      found.className = "found";
      found.textContent = agent.found.length ? agent.found.join(" · ") : "not found";
      label.appendChild(found);
      li.appendChild(label);
      list.appendChild(li);
    });
    function choose(action) {
      window.startup.choose(action, list.querySelector("input:checked").value);
    }
    document.getElementById("create").addEventListener("click", function () { choose("create"); });
    document.getElementById("open").addEventListener("click", function () { choose("open"); });
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Super Prototyping</title>
<style>
  /* Vercel's Geist look: black or white, one neutral ramp, hairline borders, 6px and 8px radii,
     and a primary button that inverts rather than colours. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #171717;
    --fg-dim: #666666;
    --border: #eaeaea;
    --border-hover: #999999;
    --hover: #fafafa;
    --accent: #171717;
    --accent-fg: #ffffff;
    --accent-hover: #383838;
    --ring: #0070f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #ededed;
      --fg-dim: #a1a1a1;
      --border: #333333;
      --border-hover: #666666;
      --hover: #1a1a1a;
      --accent: #ededed;
      --accent-fg: #0a0a0a;
      --accent-hover: #cccccc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font: 14px/1.5 "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--fg);
    background: var(--bg);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand img { width: 24px; height: 24px; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  p.sub { margin: 0 0 32px; color: var(--fg-dim); text-align: center; }
  ul {
    list-style: none;
    margin: 0 0 32px;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, 240px);
    gap: 16px;
  }
  li { position: relative; }
  /* The card is the control; the radio stays for the keyboard and the checked state. */
  input { position: absolute; opacity: 0; width: 0; height: 0; }
  label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  label:hover { border-color: var(--border-hover); background: var(--hover); }
  li:has(input:checked) > label { border-color: var(--fg); }
  li:has(input:focus-visible) > label { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ring); }
  .icon { width: 32px; height: 32px; font-size: 32px; display: inline-flex; align-items: center; margin-bottom: 8px; }
  .name { font-weight: 500; }
  .status { color: var(--fg-dim); font-size: 13px; }
  .actions { display: flex; gap: 12px; }
  button, a.button {
    font: inherit;
    font-weight: 500;
    height: 40px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button:hover, a.button:hover { border-color: var(--border-hover); background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  a.button { height: 32px; padding: 0 12px; font-size: 13px; }
  a.button svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>

  <main>
    <h1>Which agent will you work with?</h1>
    <p class="sub">It gets the super-prototyping skills copied into the project you open or create next.</p>
    <ul id="list"></ul>
    <div class="actions">
      <button id="create" type="button">Create a new project…</button>
      <button id="open" class="primary" type="button">Open a project…</button>
    </div>
  </main>
  <script>
    var agents = JSON.parse(new URLSearchParams(location.search).get("agents") || "[]");
    // The first row with something found starts selected.
    var initial = agents.find(function (a) { return a.found.length > 0; }) || agents[0];
    var list = document.getElementById("list");
    agents.forEach(function (agent) {
      var li = document.createElement("li");
      var label = document.createElement("label");
      // What detection rests on — a binary on PATH, a directory under home, an app bundle — is
      // the card's tooltip, so a wrong guess can still be checked without the row carrying it.
      label.title = agent.found.join(" · ");
      var input = document.createElement("input");
      input.type = "radio";
      input.name = "agent";
      input.value = agent.id;
      input.checked = agent === initial;
      label.appendChild(input);
      var icon = document.createElement("span");
      icon.className = "icon";
      icon.innerHTML = agent.icon; // the app's own SVG from icons/, not anything a user typed
      label.appendChild(icon);
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = agent.name;
      label.appendChild(name);
      var status = document.createElement("span");
      status.className = "status";
      status.textContent = agent.found.length ? "Found on this machine" : "Not found";
      label.appendChild(status);
      li.appendChild(label);
      list.appendChild(li);
    });
    function choose(action) {
      window.startup.choose(action, list.querySelector("input:checked").value);
    }
    document.getElementById("create").addEventListener("click", function () { choose("create"); });
    document.getElementById("open").addEventListener("click", function () { choose("open"); });
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stepwise, iOS - Pick your vibe</title>
<style>
:root{
  /* Font */
  --sw-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Surface */
  --sw-bg:#F4F0EB;
  --sw-card:#FEFEFE;
  --sw-sheet:#F0EEEF;
  --sw-well:#F8F5F9;
  --sw-chip:#EEEAE6;
  --sw-bar:rgba(255,255,255,.85);
  --sw-scrim:rgba(0,0,0,.20);

  /* Line */
  --sw-hairline:#F1F1F1;
  --sw-dash:#AEAAA5;
  --sw-grabber:#B6B3B6;

  /* Ink */
  --sw-ink:#000000;
  --sw-ink-2:#888888;
  --sw-ink-3:#BBBBBB;
  --sw-ink-inv:#FFFFFF;

  /* Accent */
  --sw-green:#2DB150;
  --sw-pro-a:#D736A9;
  --sw-pro-b:#FADEF5;

  /* Radius */
  --sw-r-tile:20.5px;
  --sw-r-pro:23.5px;
  --sw-r-list:25.5px;
  --sw-r-sheet:33.5px;
  --sw-r-icon:9px;
  --sw-r-pill:999px;
  --sw-r-phone:52px;

  /* Type */
  --sw-t-title:700 27px/27px var(--sw-font);
  --sw-t-name:700 22px/22px var(--sw-font);
  --sw-t-pill:800 19px/19px var(--sw-font);
  --sw-t-tile:600 15px/15px var(--sw-font);
  --sw-t-row:500 15px/15px var(--sw-font);
  --sw-t-note:500 13px/13px var(--sw-font);
  --sw-t-sub:400 13px/13px var(--sw-font);
  --sw-t-time:590 17px/22px var(--sw-font);

  /* Metrics */
  --sw-w:393px;
  --sw-h:852px;
  --sw-status:54px;
  --sw-gutter:20.7px;
  --sw-tile:170px;
  --sw-row:56px;
  --sw-av:92.7px;
  --sw-av-x:112.18px;
  --sw-av-y:108.78px;
  --sw-hero:117.5px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sw-font);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:24px}
.phone{position:relative;flex:none;width:var(--sw-w);height:var(--sw-h);
  border-radius:var(--sw-r-phone);overflow:hidden;background:var(--sw-bg);color:var(--sw-ink);transform:translateZ(0);
  box-shadow:0 0 0 11px #1D191A,0 0 0 12.5px #3A3735,0 24px 60px rgba(29,25,26,.28)}
.sb{position:absolute;left:0;top:0;width:var(--sw-w);height:var(--sw-status);z-index:6}
.sb .time{position:absolute;left:0;top:18.2px;width:142.4px;text-align:center;font:var(--sw-t-time)}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:20px;background:#000}
.sb svg{position:absolute;display:block;fill:currentColor}
/* iOS picks the indicator colour against the wallpaper: measure it per screen */
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:3px;background:currentColor;z-index:6}
.phone .ic{position:absolute;display:block;overflow:visible}
/* The two overrides of the shared status bar. This mockup does not draw the
   iPhone one: measured on p1, its clock ink runs 38.2-70.5 x 20.2-32.8, its
   signal bars 287.6-307.3 x 19.7-32.8, its wifi arc 314.5-331.7 x 19.7-32.3
   and its battery 339.3-366.5 x 20.2-33.2. Against templates/gen.py that is a
   clock centred on 54.35 rather than 71.2, and a right-hand cluster 5.9pt
   further right and 3.1pt higher. Two rules put the template's own status bar
   on those boxes; statusbar() itself is left alone. */
.sb .time{width:109.5px;top:14.9px}
.sb svg{translate:5.9px -3.1px}
.t{position:absolute;white-space:nowrap}
.d{position:absolute}

/* --- profile head ------------------------------------------------------ */
.hero{left:138px;top:80px;width:var(--sw-hero);height:var(--sw-hero);
  border-radius:50%;background:var(--sw-card)}
/* the badge is a ground-coloured ring with a white disc inside it, not a
   bordered circle: it punches through the hero's edge */
.shuf{left:225.3px;top:167.3px;width:30.3px;height:30.3px;border-radius:50%;
  background:var(--sw-bg)}
.shuf i{position:absolute;left:3px;top:3px;width:24.3px;height:24.3px;
  border-radius:50%;background:var(--sw-card)}
.name{left:0;top:213.92px;width:var(--sw-w);text-align:center;font:var(--sw-t-name)}
.dash{left:181.8px;top:239.3px;width:29.8px;height:1.3px;
  background:repeating-linear-gradient(to right,
    var(--sw-dash) 0 2.1px,transparent 2.1px 5.45px)}

/* --- the two tiles ----------------------------------------------------- */
.tile{top:266.9px;width:var(--sw-tile);height:170.1px;
  background:var(--sw-card);border-radius:var(--sw-r-tile)}
.well{left:219.75px;top:289.95px;width:54.5px;height:54.5px;
  border-radius:50%;background:var(--sw-well)}

/* --- the Pro card ------------------------------------------------------ */
.procard{left:var(--sw-gutter);top:449.4px;width:351.9px;height:88.5px;
  background:var(--sw-card);border-radius:var(--sw-r-pro)}
.pill{left:38.6px;top:474.9px;width:55px;height:36.5px;
  border-radius:18px 4px 17px 17px;
  background:linear-gradient(to bottom,var(--sw-pro-a),var(--sw-pro-b))}
.pill b{position:absolute;left:0;top:8.55px;width:55px;text-align:center;
  font:var(--sw-t-pill);color:var(--sw-ink);
  -webkit-text-stroke:2.9px var(--sw-ink-inv);paint-order:stroke fill}
.pill s{position:absolute;background:var(--sw-ink-inv);border-radius:50%;opacity:.8}

/* --- the settings list -------------------------------------------------- */
/* The list runs off the bottom of the screen behind a scroll fade. Sampled in
   10pt bands down x 26..96, the card's coverage over the #F4F0EB ground runs
   1.00 at y 758, .58 at 780, .26 at 800 and settles near .06 from y 818 to the
   screen foot -- the fade does not reach zero, and the "Privacy Policy" row is
   still legible under it. */
.list{left:var(--sw-gutter);top:572.1px;width:351.9px;height:279.9px;
  background:var(--sw-card);
  border-radius:var(--sw-r-list) var(--sw-r-list) 0 0;
  -webkit-mask-image:linear-gradient(to bottom,#000 185.9px,rgba(0,0,0,.06) 245.9px);
  mask-image:linear-gradient(to bottom,#000 185.9px,rgba(0,0,0,.06) 245.9px)}
.list .lab{position:absolute;font:var(--sw-t-row);color:var(--sw-ink)}
.list .hr{position:absolute;left:18.2px;width:315.8px;height:1px;
  background:var(--sw-hairline)}
.thumb{position:absolute;left:14.6px;top:23.3px;width:35.7px;height:34.8px;
  border-radius:var(--sw-r-icon);overflow:hidden}
.tgl{position:absolute;left:272.5px;top:91.1px;width:63.4px;height:28.6px;
  border-radius:var(--sw-r-pill);background:var(--sw-ink)}
.tgl i{position:absolute;left:24.8px;top:2.6px;width:36.1px;height:23.8px;
  border-radius:var(--sw-r-pill);background:var(--sw-ink-inv)}

/* --- the floating tab bar ----------------------------------------------- */
/* The shadow is the one value on this screen that is fitted rather than read:
   below the bar the ground drops to #EBE6E3 from #F4F0EB and recovers over
   about 14pt, which is this blur at this alpha to within 2 levels. */
.tabs{left:102.3px;top:770.7px;width:189px;height:62.5px;
  border-radius:var(--sw-r-pill);background:var(--sw-bar);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 5px 20px rgba(0,0,0,.055)}
.tabs u{position:absolute;left:90.7px;top:3.7px;width:93.7px;height:53.9px;
  border-radius:var(--sw-r-pill);background:var(--sw-chip)}

/* --- the sheet ----------------------------------------------------------- */
.scrim{position:absolute;inset:0;background:var(--sw-scrim);z-index:4}
.bs{left:9px;top:270px;width:375px;height:575.8px;background:var(--sw-sheet);
  border-radius:var(--sw-r-sheet);z-index:5}
.grab{position:absolute;left:170.2px;top:4.3px;width:35px;height:5.1px;
  border-radius:var(--sw-r-pill);background:var(--sw-grabber)}
.bs h1{position:absolute;left:0;top:35px;width:375px;text-align:center;
  font:var(--sw-t-title)}
/* 29.2 = the first column centre 84.55, less the 46.35 radius and the sheet's
   own left edge; 93.1 is the same subtraction down. */
.av{position:absolute;width:var(--sw-av);height:var(--sw-av);border-radius:50%;
  background:var(--sw-card)}
.av .ic{left:0;top:0;width:var(--sw-av);height:var(--sw-av)}</style>
</head>

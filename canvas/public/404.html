<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f0eeec" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <title>Page not found · Super Prototyping</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        display: grid; place-items: center; min-height: 100vh;
        background: #f0eeec; color: #1a1a1a;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      p.code { margin: 0 0 0.5rem; font-size: 0.8125rem; letter-spacing: 0.08em; color: #6b6b6b; text-transform: uppercase; }
      h1 { margin: 0 0 0.75rem; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: #4a4a4a; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 1.75rem; }
      a {
        display: inline-block; padding: 0.6rem 1.1rem; border-radius: 999px;
        text-decoration: none; font-weight: 500; color: #1a1a1a;
        border: 1px solid #1a1a1a;
      }
      a.primary { background: #1a1a1a; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>There is nothing at this address. The canvas lives at the root; open a board with <code>?canvas=&lt;slug&gt;</code>.</p>
      <nav>
        <a class="primary" href="/">Open the canvas</a>
        <a href="https://github.com/ReScienceLab/super-prototyping">View on GitHub</a>
      </nav>
    </main>
  </body>
</html>

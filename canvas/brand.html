<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <!-- Replaced with the canvas page's own name as soon as the script runs; this is what a
         browser shows in the tab and in history until then. -->
    <title>Brand</title>
    <meta name="robots" content="noindex" />
  </head>
  <!-- The kit's own ground, ink and box model (brand.css). On the element rather than on
       `:root`, because the same markup is also a tab inside the dark canvas app. -->
  <body class="brand-page">
    <div id="root"></div>
    <script type="module" src="/src/brand.tsx"></script>
  </body>
</html>
